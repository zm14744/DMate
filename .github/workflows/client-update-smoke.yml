name: Client Update & Image Upload UI Checks

on:
  push:
    branches: [main]
    paths:
      - 'static/client-update.js'
      - 'static/web-sync.js'
      - 'static/legacy-worker-retire.js'
      - 'app.py'
      - 'static/client-updates.json'
      - 'static/script.js'
      - 'static/voice-input.js'
      - 'static/voice-input.css'
      - 'static/graph-editor.js'
      - 'static/graph-editor-overlay.js'
      - 'static/graph-editor.css'
      - 'templates/index.html'
      - 'tests/test_graph_editor_ui_contract.py'
      - 'tests/client_update_contract.js'
      - 'tests/web_sync_contract.js'
      - 'tests/test_web_sync_contract.py'
      - 'tests/test_android_upload_ui_contract.py'
      - 'tests/test_android_voice_permission.py'
      - 'android/app/src/main/java/app/dmate/client/MainActivity.java'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'android/app/src/main/java/app/dmate/client/NativeUpdateManager.java'
      - '.github/workflows/client-update-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate client JavaScript
        run: |
          node --check static/client-update.js
          node --check static/web-sync.js
          node --check static/legacy-worker-retire.js
          node --check static/script.js
          node --check static/voice-input.js
          node --check static/graph-editor.js
          node --check static/graph-editor-overlay.js
          node tests/client_update_contract.js
          node tests/web_sync_contract.js
      - name: Check Android file upload and release rules
        run: |
          python -m unittest discover -s tests -p 'test_android_upload_ui_contract.py'
          python -m unittest discover -s tests -p 'test_android_voice_permission.py'
      - name: Verify installed apps receive latest web without new APK
        run: |
          python -m unittest discover -s tests -p 'test_web_sync_contract.py'
          python -m unittest discover -s tests -p 'test_graph_editor_ui_contract.py'
          python -m py_compile app.py
