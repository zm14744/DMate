          node --check static/learning-panel.js
          node --check static/conversation-titles.js
          node --check static/math-markdown.js
          node --check static/ai-answer-renderer.js
          node --check scripts/test_offline_study_browser.cjs
          node --check scripts/test_offline_workspace_browser.cjs
          node --check scripts/test_offline_records_browser.cjs
          node --check scripts/test_knowledge_graph_browser.cjs
          node --check scripts/test_graph_empty_recent_browser.cjs
          node --check scripts/test_graph_relation_navigation_browser.cjs
          node --check scripts/test_graph_all_history_browser.cjs
          node --check scripts/test_question_graph_views_browser.cjs
          node --check scripts/test_question_knowledge_graph.cjs
          node --check static/question-knowledge-graph.js
          node --check scripts/test_graph_history_selection_browser.cjs
          node --check scripts/test_graph_open_stability_browser.cjs
          node --check scripts/test_offline_graph_browser.cjs
