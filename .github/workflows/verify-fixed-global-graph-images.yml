name: Verify Fixed International Graph Images on Deployed DMate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-fixed-global-graph-images.yml"
permissions:
  contents: read
jobs:
  verify-real-originals:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      DMATE_BENCH_URL: https://dmate.zeabur.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install "requests>=2.31,<3" "Pillow>=10,<12" "PyMuPDF>=1.24,<2"
      - name: Confirm new image audit is actually deployed
        run: |
          python - <<'PY'
          import requests,time,sys
          url="https://dmate.zeabur.app/health"
          marker="2026-10-20-v3-diagram-only-and-arrow-uncertainty"
          for i in range(20):
              try:
                  data=requests.get(url,timeout=10).json()
                  found=data.get("graph_image_audit_version")
                  print("DEPLOYED_IMAGE_AUDIT",i+1,found,flush=True)
                  if found==marker:
                      print("READY: new independent image audit is online",flush=True)
                      sys.exit(0)
              except Exception as e:
                  print("WAIT_DEPLOYMENT",type(e).__name__,flush=True)
              time.sleep(15)
          print("DEPLOYMENT_NOT_VERIFIED: image tests must not claim fixed code passed",flush=True)
          sys.exit(2)
          PY
      - name: Recheck SJTU Euler three graph original image
        continue-on-error: true
        run: |
          python tests/global_graph_picture_benchmark.py \
            --start 0 --count 1 --pause 15 --timeout 95 --strict \
            --output fixed_sjtu_euler_original.json
      - run: sleep 12
      - name: Recheck Aizu vertical isomorphism original image
        continue-on-error: true
        run: |
          python tests/global_graph_picture_benchmark.py \
            --start 9 --count 1 --pause 15 --timeout 95 --strict \
            --output fixed_aizu_iso_original.json
      - run: sleep 12
      - name: Recheck UNSW independently drawn isomorphism images
        continue-on-error: true
        run: |
          python tests/global_graph_picture_benchmark.py \
            --start 6 --count 2 --pause 12 --timeout 95 --strict \
            --output fixed_unsw_iso_originals.json
      - run: sleep 12
      - name: Recheck real Cornell final original crossing diagrams
        continue-on-error: true
        run: |
          python tests/global_graph_picture_benchmark.py \
            --start 13 --count 1 --pause 15 --timeout 95 --strict \
            --output fixed_cornell_original.json
      - name: Aggregate results with uncertainty distinct from correctness
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, collections,sys
          names=["fixed_sjtu_euler_original.json","fixed_aizu_iso_original.json",
                 "fixed_unsw_iso_originals.json","fixed_cornell_original.json"]
          out=[]
          for name in names:
              p=pathlib.Path(name)
              if p.exists():
                  out.extend(json.loads(p.read_text(encoding="utf-8")).get("cases",[]))
              else:
                  print("MISSING_OUTPUT",name,flush=True)
          for x in out:
              print("CASE",x.get("id"),x.get("status"),x.get("recognition_verdict"),flush=True)
          print("COUNTS",dict(collections.Counter(x.get("status") for x in out)),flush=True)
          if len(out)<5:
              sys.exit(1)
          if any(x.get("status") in ("ANSWER_WRONG","OCR_FAILED","SOURCE_FAILED","ANSWER_REQUEST_FAILED")
                 for x in out):
              sys.exit(1)
          PY
      - name: Upload all real images and OCR/answer pairs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-real-university-graph-image-evidence
          path: |
            fixed_sjtu_euler_original.json
            fixed_aizu_iso_original.json
            fixed_unsw_iso_originals.json
            fixed_cornell_original.json
            global_graph_original_crops/*.png
          retention-days: 30
          if-no-files-found: warn
