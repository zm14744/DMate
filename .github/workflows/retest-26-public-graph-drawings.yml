name: Recheck 26 Public Graph Drawings - CPU Topology
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retest-26-public-graph-drawings.yml"
permissions:
  contents: read
jobs:
  original-public-graph-images:
    runs-on: ubuntu-22.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU image graph dependencies
        run: python -m pip install "numpy<2" "Pillow>=10,<12" "opencv-python-headless==4.10.0.84" "requests>=2.31" "cairosvg>=2.7"
      - name: Run all 26 source drawing topologies without pretending this is Vision OCR
        env:
          RUNNER_TEMP: .
        run: python scripts/benchmark_public_graph_images.py --min-downloaded 0
      - name: Publish actual hit/miss status of source downloads and graph topology
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("dmate-public-graph-benchmark.json")
          if not p.exists():
              print("NO_REPORT")
          else:
              data=json.loads(p.read_text())
              print("REAL_PUBLIC_GRAPH_RESULT",json.dumps(data["summary"],ensure_ascii=False),flush=True)
              for row in data["records"]:
                  print("SOURCE",row.get("file"),"STATUS",row.get("status"),
                        "EXACT_COUNTS",row.get("known_graph_exact"),flush=True)
          PY
      - name: Save original source URLs and complete comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 26-public-graph-drawings-cpu-results
          path: dmate-public-graph-benchmark.json
          retention-days: 30
          if-no-files-found: warn
