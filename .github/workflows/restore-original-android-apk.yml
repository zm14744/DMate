name: Restore Original DMate Android APK

# One-time rollback of the overwritten v1.0.1 release asset.
# Never installs anything on existing phones. No web feature change needs an APK.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-original-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dmate-restore-original-apk
  cancel-in-progress: false

jobs:
  rollback-release-asset:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout the original v1.0.1 source, not current native code
        uses: actions/checkout@v4
        with:
          ref: v1.0.1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK and signing tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore signing key
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.DMATE_ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/dmate-release.jks"
          echo "DMATE_KEYSTORE_PATH=$RUNNER_TEMP/dmate-release.jks" >> "$GITHUB_ENV"
          echo "DMATE_KEYSTORE_PASSWORD=${{ secrets.DMATE_ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "DMATE_KEY_ALIAS=${{ secrets.DMATE_ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "DMATE_KEY_PASSWORD=${{ secrets.DMATE_ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build the original signed v1.0.1 APK
        working-directory: android
        run: gradle assembleRelease --stacktrace

      - name: Verify the original version and signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/DMate.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose dist/DMate.apk
          DETAILS=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging dist/DMate.apk | head -n 1)
          echo "$DETAILS"
          [[ "$DETAILS" == *"name='app.dmate.client'"* ]]
          [[ "$DETAILS" == *"versionCode='2'"* ]]
          [[ "$DETAILS" == *"versionName='1.0.1'"* ]]
          test -s dist/DMate.apk

      - name: Replace only the overwritten APK with original version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload v1.0.1 dist/DMate.apk --clobber --repo "$GITHUB_REPOSITORY"
          gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | select(.name=="DMate.apk") | {name, size, updatedAt}'
