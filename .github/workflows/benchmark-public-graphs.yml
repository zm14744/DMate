name: Public Graph Diagram Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/benchmark_public_graph_images.py"
      - ".github/workflows/benchmark-public-graphs.yml"
  pull_request:
    paths:
      - "scripts/benchmark_public_graph_images.py"
      - ".github/workflows/benchmark-public-graphs.yml"

permissions:
  contents: read

jobs:
  real-world-images:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight graph and vector image dependencies
        run: python -m pip install "numpy<2" "Pillow>=10,<12" "opencv-python-headless==4.10.0.84" "requests>=2.31" "cairosvg>=2.7"
      - name: Test 26 public Wikimedia textbook/research graph diagrams
        run: python scripts/benchmark_public_graph_images.py --min-downloaded 8
