name: Brazilian University Original Graph Figure Regression
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Global University Graph Diagram OCR and Reasoning"]
    types: [completed]
permissions:
  contents: read
jobs:
  brazil-university:
    runs-on: ubuntu-22.04
    timeout-minutes: 14
    env:
      PYTHONPATH: .
      DMATE_BENCH_URL: https://dmate.zeabur.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "requests>=2.31,<3" "Pillow>=10,<12" "PyMuPDF>=1.24,<2"
      - name: Test actual Brazil UTFPR diagrams (not redrawn)
        run: |
          python tests/global_graph_picture_benchmark.py \
            --start 14 --count 3 --pause 12 --timeout 85 \
            --output brazil_graph_original_results.json \
            --directory brazil_graph_original_crops \
            --strict
      - name: Upload all Brazilian original diagrams and model traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brazil-university-original-graph-evidence
          path: |
            brazil_graph_original_results.json
            brazil_graph_original_crops/*.png
          retention-days: 30
          if-no-files-found: warn
