name: University Discrete Mathematics Benchmark
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/university-discrete-benchmark.yml"
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install benchmark dependencies
        run: python -m pip install "requests>=2.31,<3" "Pillow>=10,<12" "PyMuPDF>=1.24,<2"
      - name: Compile benchmark and app
        run: python -m py_compile tests/university_discrete_benchmark.py graph_consistency.py ai.py app.py
      - name: Test live university cases against deployed DMate
        env:
          DMATE_BENCH_URL: https://dmate.zeabur.app
        run: |
          python tests/university_discrete_benchmark.py \
            --max-chat 18 --timeout 70 --delay 4 \
            --output university_benchmark_results.json
      - name: Upload answer and recognition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: university-discrete-benchmark-results
          path: university_benchmark_results.json
          if-no-files-found: warn
          retention-days: 30
