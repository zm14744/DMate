name: Graph OCR nextgen acceptance
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_suite:
        description: 'Run exhaustive tests, browser replays and 2-CPU/4GB resource checks before merging'
        type: boolean
        default: false
      live_api:
        description: 'Run original-image OCR with test GitHub Secrets (paid API calls)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: graph-nextgen-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  mechanisms:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.55.0-noble@sha256:640d578aae63cfb632461d1b0aecb01414e4e020864ac3dd45a868dc0eff3078
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare container Python and repository identity
        timeout-minutes: 1
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          root = Path(os.environ['pythonLocation']).resolve(strict=True)
          library = root / 'lib'
          if root != Path(sys.base_prefix).resolve(strict=True) or not library.is_dir():
              raise SystemExit('setup-python library directory does not match this interpreter')
          if '\n' in str(library) or not list(library.glob(f'libpython{sys.version_info.major}.{sys.version_info.minor}.so*')):
              raise SystemExit('setup-python shared library was not found')
          Path('/etc/ld.so.conf.d/dmate-ci-python.conf').write_text(str(library) + '\n')
          PY
          ldconfig
          env -u LD_LIBRARY_PATH "$pythonLocation/bin/python" -c 'import sys; print("Clean-library Python:", sys.version)'
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          env -i PATH="$PATH" HOME="$HOME" git -C "$GITHUB_WORKSPACE" rev-parse --verify HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Flask requests numpy==1.26.4 opencv-contrib-python-headless==4.10.0.84 Pillow==11.3.0 networkx pytest playwright==1.55.0 -r requirements-agents.txt
      # PR feedback stays bounded and checks only the changing graph-editor contract.
      # Expensive historical suites and the 4GB Docker check are kept for manual pre-merge runs.
      - name: Use the bundled Chromium for real editor interactions
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as runtime:
              executable = Path(runtime.chromium.executable_path)
          if not executable.is_file():
              raise SystemExit("Pinned Chromium is required for graph-editor smoke tests")
          with open(os.environ["GITHUB_ENV"], "a") as target:
              target.write(f"DMATE_BROWSER_EXECUTABLE={executable}\n")
          print("Graph editor Chromium:", executable)
          PY
      - name: Focused editor and confirmation regression (free, no OCR/model requests)
        run: |
          python -m pytest -q \
            tests/test_visual_graph_editor.py \
            tests/test_graph_overlay.py \
            tests/test_graph_confirmation.py \
            tests/test_graph_description.py \
            tests/test_graph_manual_regions.py \
            tests/test_text_region_batch.py \
            tests/test_graph_semantic_schema.py \
            tests/test_evidence_frontend_contract.py::test_public_projection_preserves_atomic_edges_but_is_not_a_drawing_api \
            tests/test_graph_first_pass_ui.py::test_exact_rendering_contract_checks_every_field_and_panel \
            tests/test_semantic_chat_snapshot_frontend.py::test_snapshot_whitelist_strips_auxiliary_fields_without_changing_instances \
            tests/test_graph_fast_pipeline.py::test_local_review_keeps_only_same_identity_and_same_topology_drawing_geometry \
            tests/test_ocr_application_contract.py::test_manual_graph_upload_registers_source_without_any_vision_or_ocr_call
      - name: Graph JavaScript syntax and compact render tests
        run: |
          node --check static/graph-editor-model.js
          node --check static/graph-editor-overlay.js
          node --check static/graph-editor-format.js
          node --check static/graph-editor.js
          node --check static/script.js
          node tests/graph_display_regression.js
          node tests/graph_nextgen_display.js
      - name: Install the exact DejaVu test font with bounded APT time
        if: github.event_name == 'workflow_dispatch' && inputs.full_suite
        timeout-minutes: 3
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          timeout --kill-after=5s 90s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Languages=none update
          timeout --kill-after=5s 60s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends fonts-dejavu-core=2.37-8
          python - <<'PY'
          from PIL import ImageFont
          font = ImageFont.truetype('DejaVuSans.ttf', 34)
          print('Required test font:', font.path)
          PY
      - name: Full regression only before merge or on explicit request
        if: github.event_name == 'workflow_dispatch' && inputs.full_suite
        run: python -m pytest -q tests
      - name: Prepare pinned public browser scripts with TLS verification
        if: github.event_name == 'workflow_dispatch' && inputs.full_suite
        run: |
          python - <<'PY'
          import os, re, sys
          from pathlib import Path
          sys.path.insert(0, 'tests')
          from browser_assets import verified_asset
          urls = re.findall(r'<script[^>]+src="(https://cdn\.jsdelivr\.net/[^"?]+\.js)"',
                            Path('templates/index.html').read_text())
          if not urls:
              raise SystemExit('Pinned browser scripts were not found')
          for url in sorted(set(urls)):
              verified_asset(url, Path(os.environ['RUNNER_TEMP']) / 'frontend_public_cdn_cache')
          PY
      - if: github.event_name == 'workflow_dispatch' && inputs.full_suite
        run: python tests/nextgen_browser.py --mode contract --output artifacts/browser-contract --cdn-cache "$RUNNER_TEMP/frontend_public_cdn_cache"
      - name: Verify current evidence review dialog and real upload route in Chromium
        if: github.event_name == 'workflow_dispatch' && inputs.full_suite
        run: |
          python - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          env = os.environ.copy()
          with sync_playwright() as browser:
              env['DMATE_BROWSER_EXECUTABLE'] = browser.chromium.executable_path
          env['DMATE_FRONTEND_CONTRACT_OUTPUT'] = str(Path(env['RUNNER_TEMP']) / 'dmate-evidence-browser')
          env['DMATE_UI_REPLAY_TEST_OUTPUT'] = str(Path(env['RUNNER_TEMP']) / 'dmate-ui-replay')
          env['DMATE_UPLOAD_INTEGRATION_OUTPUT'] = str(Path(env['RUNNER_TEMP']) / 'dmate-upload-integration')
          env['DMATE_BROWSER_CDN_CACHE'] = str(Path(env['RUNNER_TEMP']) / 'frontend_public_cdn_cache')
          subprocess.run([sys.executable, '-m', 'pytest', '-q',
                          'tests/test_evidence_frontend_contract.py',
                          'tests/test_graph_first_pass_ui.py',
                          'tests/test_ocr_upload_integration.py'], env=env, check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.full_suite
        with:
          name: nextgen-browser-contract-not-accuracy
          path: |
            artifacts/browser-contract
            ${{ runner.temp }}/dmate-evidence-browser
            ${{ runner.temp }}/dmate-ui-replay
            ${{ runner.temp }}/dmate-upload-integration
  resource-limit:
    if: github.event_name == 'workflow_dispatch' && inputs.full_suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build existing production dependency set
        run: docker build -t dmate-ocr-test .
      - name: Measure real model RSS, wall time and success in fixed cgroup
        run: |
          mkdir -p artifacts/resources
          docker run --name dmate-ocr-resource --cpus=2 --memory=4g --memory-swap=4g \
            -e DMATE_GRAPH_NEXTGEN=1 -v "$PWD/artifacts/resources:/results" \
            dmate-ocr-test python scripts/benchmark_ocr_resources.py
      - name: Record container OOM status
        if: always()
        run: docker inspect dmate-ocr-resource --format '{{json .State}}' > artifacts/resources/container-state.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nextgen-real-model-resources
          path: artifacts/resources
  original-images-live:
    if: github.event_name == 'workflow_dispatch' && inputs.live_api
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DASHSCOPE_API_KEY: ${{ secrets.DMATE_TEST_DASHSCOPE_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DMATE_TEST_DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Require complete original conversation corpus before full regression
        run: python scripts/graph_corpus.py validate --full
      - name: Require explicit test secrets; never silently mock a real API test
        run: test -n "$DASHSCOPE_API_KEY" && test -n "$DEEPSEEK_API_KEY"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install playwright==1.55.0 requests Pillow networkx
      - run: python -m playwright install --with-deps chromium
      - run: docker build -t dmate-ocr-live .
      - name: Start branch application, isolated from production
        run: |
          docker run -d --name dmate-ocr-live --cpus=2 --memory=4g --memory-swap=4g \
            -e DMATE_GRAPH_NEXTGEN=1 -e DASHSCOPE_API_KEY -e DEEPSEEK_API_KEY \
            -p 127.0.0.1:8080:8080 dmate-ocr-live
      - name: Upload exact originals and read real review dialog
        run: python tests/nextgen_browser.py --mode live --base-url http://127.0.0.1:8080 --output artifacts/live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nextgen-originals-actual-ocr-and-dialog
          path: artifacts/live
