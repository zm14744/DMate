name: Sync DMate Icon Assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_icons.py"
      - "scripts/check_icon_assets.py"
      - "static/manifest.webmanifest"
      - "static/manifest-mobile.webmanifest"
      - "templates/index.html"
      - "app.py"
      - "static/script.js"
      - "scripts/test_pwa_install_support.cjs"
      - ".github/workflows/sync-icon-assets.yml"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Generate icons
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python scripts/generate_icons.py
          python scripts/check_icon_assets.py
      - name: Test PWA install gating
        run: node scripts/test_pwa_install_support.cjs
      - name: Commit canonical binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f static/icons/*.png static/icons/*.ico static/icons/*.svg
          git add -f desktop/src-tauri/icons/*.png desktop/src-tauri/icons/*.ico desktop/src-tauri/icons/*.icns
          if git diff --cached --quiet; then
            echo "Canonical icons unchanged"
          else
            git commit -m "Sync generated DMate app and PWA icons"
            git push origin HEAD:main
          fi
