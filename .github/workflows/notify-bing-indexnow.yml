name: Notify Bing of DMate homepage update (IndexNow)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "static/ba35d6e4c10db2df19bf4c02f7d99646.txt"
      - ".github/workflows/notify-bing-indexnow.yml"

permissions:
  contents: read

jobs:
  notify-bing:
    name: Send DMate homepage update to Bing
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Wait for domain-root IndexNow key to become publicly accessible
        shell: bash
        run: |
          set -euo pipefail
          KEY="ba35d6e4c10db2df19bf4c02f7d99646"
          KEY_URL="https://dmate.zeabur.app/${KEY}.txt"
          valid=0
          for attempt in $(seq 1 72); do
            payload="$(curl --silent --show-error --fail --location --max-time 15 "${KEY_URL}" || true)"
            if [ "${payload}" = "${KEY}" ]; then
              echo "Verified root-level ownership key online."
              valid=1
              break
            fi
            echo "Waiting for Zeabur deployment (${attempt}/72)."
            sleep 10
          done
          if [ "${valid}" -ne 1 ]; then
            echo "::error::Domain-root key still unavailable; IndexNow not submitted."
            exit 1
          fi

      - name: Submit homepage URL to Bing via IndexNow
        shell: bash
        run: |
          set -euo pipefail
          KEY="ba35d6e4c10db2df19bf4c02f7d99646"
          URL="https://dmate.zeabur.app/"
          KEY_URL="https://dmate.zeabur.app/${KEY}.txt"
          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error --location --max-time 30 \
            --get "https://www.bing.com/indexnow" \
            --data-urlencode "url=${URL}" \
            --data-urlencode "key=${KEY}" \
            --data-urlencode "keyLocation=${KEY_URL}" \
            --output "${response_file}" --write-out "%{http_code}")"
          echo "Bing IndexNow HTTP ${http_code}"
          cat "${response_file}"
          echo ""
          case "${http_code}" in
            200) echo "Bing accepted the updated homepage notification." ;;
            202) echo "::warning::Bing received the URL. Verification of the key is pending until the public file is online." ;;
            *) echo "::error::Bing did not accept the IndexNow request (HTTP ${http_code})."; exit 1 ;;
          esac
