name: ETH Zurich Original Graph Diagram Regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eth-original-graph-diagram.yml"
permissions:
  contents: read
jobs:
  swiss-diagrams:
    runs-on: ubuntu-22.04
    timeout-minutes: 16
    env:
      PYTHONPATH: .
      DMATE_BENCH_URL: https://dmate.zeabur.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PDF and HTTP tools
        run: python -m pip install "requests>=2.31,<3" "Pillow>=10,<12" "PyMuPDF>=1.24,<2"
      - name: Run original ETH Zurich illustrated graph exercises
        run: |
          python tests/global_graph_picture_benchmark.py \
            --start 17 --count 2 --pause 10 --timeout 90 \
            --output eth_zurich_original_diagram_results.json \
            --directory eth_zurich_original_crops \
            --strict
      - name: Preserve actual ETH exam-sourced figures and model answers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eth-zurich-real-graph-diagram-evidence
          path: |
            eth_zurich_original_diagram_results.json
            eth_zurich_original_crops/*.png
          retention-days: 30
          if-no-files-found: warn
