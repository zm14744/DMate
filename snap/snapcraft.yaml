name: dmate
base: core24
version: '1.0.2'
title: DMate
summary: Discrete Mathematics Tutor
description: |
  DMate helps students learn discrete mathematics with AI explanations,
  practice generation, graph and image recognition, mistake review,
  retesting, knowledge visualization, and learning-record synchronization.
  An internet connection is required for online AI features.
website: https://dmate.zeabur.app/
icon: snap/gui/dmate.png
grade: stable
confinement: strict

platforms:
  amd64:

apps:
  dmate:
    command: usr/bin/dmate-desktop
    extensions: [gnome]
    environment:
      # Encrypted collection; its master secret comes from the desktop Secret
      # portal. If the portal is unavailable, fail instead of using a fallback.
      SECRET_BACKEND: file
    plugs:
      - network
      - home
      - browser-support
      - audio-playback
      - audio-record
      - removable-media

parts:
  dmate-binary:
    plugin: dump
    source: ./DMate_1.0.2_amd64.deb
    source-type: deb
    # Tauri uses WebKitGTK; the GNOME extension alone does not supply it.
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libsecret-1-0

  vault-probe:
    plugin: dump
    source: ./snap-test
    organize:
      dmate-vault-probe: usr/lib/dmate/dmate-vault-probe
