name: Test DMate Image Recognition
on:
  push:
    branches: [main]
    paths:
      - "graph_recognition.py"
      - "graph_recognition_v2.py"
      - "graph_consistency.py"
      - "graph_integrity.py"
      - "math_answer_guard.py"
      - "tests/test_math_answer_guard.py"
      - "tests/test_graph_integrity.py"
      - "tests/test_graph_vision_audit.py"
      - "tests/test_graph_consistency.py"
      - "ocr.py"
      - "ai.py"
      - "app.py"
      - "tests/test_graph_recognition_v2.py"
      - ".github/workflows/test-image-recognition.yml"
  pull_request:
    paths:
      - "graph_recognition.py"
      - "graph_recognition_v2.py"
      - "graph_consistency.py"
      - "graph_integrity.py"
      - "math_answer_guard.py"
      - "tests/test_math_answer_guard.py"
      - "tests/test_graph_integrity.py"
      - "tests/test_graph_vision_audit.py"
      - "tests/test_graph_consistency.py"
      - "ocr.py"
      - "ai.py"
      - "app.py"
      - "tests/test_graph_recognition_v2.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image-recognition:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only image test dependencies
        run: python -m pip install "numpy<2" "Pillow>=10,<12" "opencv-python-headless==4.10.0.84" "requests>=2.31,<3"
      - name: Compile image pipeline
        run: python -m py_compile graph_recognition.py graph_recognition_v2.py graph_consistency.py graph_integrity.py math_answer_guard.py ocr.py ai.py app.py
      - name: Run graph crossing and blur regressions
        run: |
          python -m unittest discover -s tests -p "test_graph_recognition_v2.py" -v
          python -m unittest discover -s tests -p "test_graph_consistency.py" -v
          python -m unittest discover -s tests -p "test_graph_integrity.py" -v
          python -m unittest discover -s tests -p "test_graph_vision_audit.py" -v
          python -m unittest discover -s tests -p "test_math_answer_guard.py" -v
