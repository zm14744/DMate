name: University OCR versus Reasoning Benchmark
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/university_image_answer_benchmark.py"
      - ".github/workflows/university-ocr-reasoning-benchmark.yml"
permissions:
  contents: read
jobs:
  ocr-reasoning:
    runs-on: ubuntu-22.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "requests>=2.31,<3" "PyMuPDF>=1.24,<2" "Pillow>=10,<12"
      - name: Run university exam PDF images, gold text and OCR chain
        env:
          DMATE_BENCH_URL: https://dmate.zeabur.app
        run: python tests/university_image_answer_benchmark.py
      - name: Upload independent stage verdicts and raw model replies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mit-original-pdf-ocr-versus-reasoning
          path: university_ocr_answer_results.json
          retention-days: 30
          if-no-files-found: warn
