          node --check scripts/test_conversation_context_browser.cjs
          node --check scripts/test_math_markdown.cjs
          node --check scripts/test_offline_appearance_browser.cjs
          node --check scripts/test_appearance_bootstrap_browser.cjs
          node --check scripts/test_offline_data_migration_browser.cjs
          node --check scripts/test_offline_storage_browser.cjs
          node --check scripts/test_offline_device_storage_browser.cjs
