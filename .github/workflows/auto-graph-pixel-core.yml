name: Auto Graph Pixel Safety Contract

on:
  push:
    branches: [main]
    paths:
      - 'graph_pixel_safety.py'
      - 'image_evidence.py'
      - 'graph_semantic_schema.py'
      - 'tests/test_auto_graph_pixel_core.py'
      - '.github/workflows/auto-graph-pixel-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pixel-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal offline CV test environment
        run: |
          python -m pip install --disable-pip-version-check pytest==8.4.2 Pillow==11.3.0 numpy==2.1.3 opencv-python-headless==4.11.0.86
      - name: Verify original color, shadows, show-through, crossings and per-graph types
        run: python -m pytest -q tests/test_auto_graph_pixel_core.py
