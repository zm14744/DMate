name: Chinese University Discrete Math Regression
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chinese-university-regression.yml"
permissions:
  contents: read
concurrency:
  group: chinese-university-discrete-regression
  cancel-in-progress: false
jobs:
  university-chinese:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      DMATE_BENCH_URL: https://dmate.zeabur.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install targeted OCR dependencies
        run: python -m pip install "requests>=2.31,<3" "Pillow>=10,<12" "PyMuPDF>=1.24,<2"
      - name: Compile university benchmark
        run: python -m py_compile tests/chinese_university_regression.py tests/university_discrete_benchmark.py
      - name: Rerun eight former rate-limited problems
        continue-on-error: true
        run: |
          python tests/chinese_university_regression.py \
            --slice missed8 --delay 8 --timeout 75 --strict \
            --output results_previous_eight.json
      - name: Allow chat capacity to recover
        run: sleep 45
      - name: Test real Chinese university text problems
        continue-on-error: true
        run: |
          python tests/chinese_university_regression.py \
            --slice chinese --delay 8 --timeout 75 --strict \
            --output results_chinese_university.json
      - name: Allow OCR capacity to recover
        run: sleep 30
      - name: Test original Chinese university PDF question images
        continue-on-error: true
        run: |
          python tests/chinese_university_regression.py \
            --images --images-only --delay 12 --timeout 90 --strict \
            --output results_chinese_original_ocr.json
      - name: Generate factual summary and fail on unresolved requests
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, sys
          paths=["results_previous_eight.json","results_chinese_university.json","results_chinese_original_ocr.json"]
          overall={}
          invalid=False
          for p in paths:
              path=pathlib.Path(p)
              if not path.exists():
                  print("MISSING_RESULTS",p)
                  invalid=True
                  continue
              data=json.loads(path.read_text(encoding="utf-8"))
              items=data["text"]+data["images"]
              totals={}
              for x in items:
                  totals[x["verdict"]]=totals.get(x["verdict"],0)+1
                  if x["verdict"] in ("SUSPECT","HTTP_FAILURE","OCR_SUSPECT_OR_FAILED"):
                      invalid=True
              overall[p]=totals
              print("RESULTS",p,totals,flush=True)
          pathlib.Path("chinese_university_summary.json").write_text(
              json.dumps(overall,ensure_ascii=False,indent=2),encoding="utf-8")
          # A successful necessary-token match still requires proof review.
          if invalid:
              print("UNRESOLVED_CASES: inspect published artifacts",flush=True)
              sys.exit(1)
          print("NO_AUTOMATED_ANOMALIES: not a proof of full mathematical correctness",flush=True)
          PY
      - name: Preserve all full answers, OCR outputs and page crops
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chinese-university-discrete-evidence
          path: |
            results_previous_eight.json
            results_chinese_university.json
            results_chinese_original_ocr.json
            chinese_university_summary.json
            chinese_university_ocr_samples/*.png
          retention-days: 30
          if-no-files-found: warn
