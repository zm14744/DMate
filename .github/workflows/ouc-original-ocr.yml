name: DMate Original OUC Image OCR Review

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ouc-original-ocr.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright, Pillow and Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Restore original screenshots and verify exact hashes
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, pathlib
          source = pathlib.Path('tests/.incoming')
          destination = pathlib.Path('artifacts/original-inputs')
          destination.mkdir(parents=True,exist_ok=True)
          files = [
            ('ouc_original_180441.png.b64', '屏幕截图 2026-10-21 180441.png',
             '6e4b69854cd918b60a29dd3887d88dde8682eacfba60fb019b5309a5d9fc4c97'),
            ('ouc_original_180525.png.b64', '屏幕截图 2026-10-21 180525.png',
             'f6b8df8849c2ffaf9818270ee289cc8570bf2591236fcac1632eaca073cebbaa'),
          ]
          for input_name, output_name, expected_hash in files:
              raw = base64.b64decode((source/input_name).read_text().strip(), validate=False)
              digest = hashlib.sha256(raw).hexdigest()
              assert digest == expected_hash, f'Original-image SHA-256 mismatch: {input_name}'
              (destination/output_name).write_bytes(raw)
              print(f'Original verified: {output_name} ({len(raw)} bytes, SHA256 {digest})')
          PY
      - name: Playwright upload BOTH actual OUC screenshots and read OCR popup
        run: |
          python tests/ocr_regression.py \
            --mode live \
            --cases tests/fixtures/ouc_manual_visual_ground_truth_20261021.json \
            --image-dir artifacts/original-inputs \
            --limit 2 \
            --timeout 240 \
            --strict \
            --output artifacts/original-ocr
      - name: Upload comparison report, actual OCR JSON and popup screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dmate-ouc-original-image-ocr
          path: |
            artifacts/original-ocr/
          retention-days: 3
          if-no-files-found: warn
