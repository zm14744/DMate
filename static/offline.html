<script>
/* 首帧直接沿用 DMate 当前设备的外观设置，避免离线工作区闪现另一套主题。 */
(function () {
  try {
    var settings = JSON.parse(localStorage.getItem("dmate:offline:appearance:v1") || "null") || {};
    var mode = ["light","dark","navy"].includes(settings.mode) ? settings.mode
      : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var root = document.documentElement;
    root.dataset.appearanceTheme = mode;
    root.style.colorScheme = mode === "light" ? "only light" : "dark";
    var accents = {
      blue:["#3b82f6","59,130,246","#2563eb","#1d4ed8","#60a5fa","#93c5fd"],
      purple:["#8b5cf6","139,92,246","#7c3aed","#6d28d9","#a78bfa","#c4b5fd"],
      teal:["#14b8a6","20,184,166","#0d9488","#0f766e","#5eead4","#99f6e4"]
    };
    var accent = accents[settings.accent] || accents.blue;
    ["--accent","--accent-rgb","--accent-deep","--accent-deeper","--accent-soft","--accent-pale"]
      .forEach(function (key,index) { root.style.setProperty(key,accent[index]); });
    root.style.setProperty("--accent-bg","rgba("+accent[1]+",.22)");
    root.style.setProperty("--font-scale",settings.fontSize === "small" ? ".92" : settings.fontSize === "large" ? "1.08" : "1");
    root.style.setProperty("--panel-alpha",String((Number(settings.panelOpacity) || 100)/100));
    root.style.setProperty("--bubble-alpha",String((Number(settings.bubbleOpacity) || 100)/100));
  } catch (_) {}
})();
</script>

    <section class="offline-panel" id="notesPanel" hidden>
      <div class="offline-toolbar">

    <section class="offline-panel" id="drawingPanel" hidden>
      <div class="offline-intro">
        <h2>独立绘图</h2>
        <p>使用 DMate 现有图形编辑器。画板保存在当前设备，不调用在线识图或 AI 指导。</p>
      </div>
      <div id="offlineDrawingHost" class="offline-drawing-host"></div>
    </section>

    <section class="offline-panel" id="graphPanel" hidden>
      <div class="offline-toolbar">
        <div><strong id="graphCount">知识图谱</strong><span class="toolbar-muted">内置课程知识结构</span></div>
        <input type="search" id="graphSearch" class="offline-search" placeholder="搜索知识点" aria-label="搜索知识点">
      </div>
      <div class="offline-chip-row" id="graphCategories"></div>
      <div class="offline-card-grid" id="graphNodes"></div>
    </section>

    <section class="offline-panel" id="questionsPanel" hidden>
      <div class="offline-toolbar question-toolbar">
        <div><strong id="questionCount">题库</strong><span class="toolbar-muted">中文题目 · 答案与解析</span></div>
        <div class="offline-filters">
          <select id="questionCategory" aria-label="按章节筛选"><option value="">全部章节</option></select>
          <select id="questionDifficulty" aria-label="按难度筛选">
            <option value="">全部难度</option><option value="基础">基础</option><option value="中等">中等</option><option value="进阶">进阶</option>
          </select>
        </div>
      </div>
      <div class="question-layout">
        <div class="question-list" id="questionList"></div>
        <article class="question-detail" id="questionDetail">
          <div class="offline-empty"><h2>选择一道题目</h2><p>从左侧题目列表中选择题目，开始练习。</p></div>
        </article>
      </div>
    </section>

    <section class="offline-panel" id="conceptsPanel" hidden>
      <div class="offline-toolbar">
        <div><strong id="conceptCount">概念库</strong><span class="toolbar-muted">简体中文知识条目</span></div>
        <input type="search" id="conceptSearch" class="offline-search" placeholder="搜索概念" aria-label="搜索概念">
      </div>
      <div class="concept-layout">
        <div class="concept-list" id="conceptList"></div>
        <article class="concept-detail" id="conceptDetail">
          <div class="offline-empty"><h2>选择一个知识点</h2><p>查看定义、解释、公式、例题和易错点。</p></div>
        </article>
      </div>
    </section>
  </main>
</div>

<dialog id="recordDialog" class="modal offline-dialog">
  <div class="modal-card offline-form">
    <div class="modal-head">
      <div id="recordDialogTitle">添加记录</div>
      <button type="button" class="modal-close-dot" id="cancelRecord" aria-label="关闭" title="关闭"></button>
    </div>
    <form id="recordForm">
      <label>标题<input id="recordTitle" maxlength="160" required></label>
      <label>内容<textarea id="recordContent" rows="9" maxlength="12000" required></textarea></label>
      <div class="offline-dialog-actions">
          <button type="submit" class="offline-primary primary">保存到本机</button>
      </div>
    </form>
  </div>
</dialog>
<dialog id="offlineAppearanceDialog" class="modal offline-dialog offline-appearance-dialog" aria-labelledby="offlineAppearanceTitle">
  <div class="modal-card appearance-card">
    <div class="modal-head"><div id="offlineAppearanceTitle" tabindex="-1" autofocus>外观</div><button id="offlineAppearanceClose" class="modal-close-dot" type="button" aria-label="关闭外观" title="关闭外观"></button></div>
    <div class="appearance-body">
      <section class="appearance-section"><div class="appearance-section-title">主题</div><div class="appearance-segmented">
        <button type="button" data-offline-theme="light">浅色</button><button type="button" data-offline-theme="dark">深色</button><button type="button" data-offline-theme="navy">藏青</button>
      </div></section>
      <section class="appearance-section"><div class="appearance-section-title">强调色</div><div class="appearance-swatches">
        <button type="button" class="appearance-swatch" data-offline-accent="blue" aria-label="蓝色" style="--swatch:#3b82f6"></button><button type="button" class="appearance-swatch" data-offline-accent="purple" aria-label="紫色" style="--swatch:#8b5cf6"></button><button type="button" class="appearance-swatch" data-offline-accent="teal" aria-label="青色" style="--swatch:#14b8a6"></button>
      </div></section>
      <section class="appearance-section"><div class="appearance-section-title">字号</div><div class="appearance-segmented">
        <button type="button" data-offline-font="small">小</button><button type="button" data-offline-font="medium">标准</button><button type="button" data-offline-font="large">大</button>
      </div></section>
    </div>
  </div>
</dialog>
<div class="offline-toast" id="offlineToast" role="status" hidden></div>
