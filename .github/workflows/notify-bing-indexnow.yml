name: Notify Bing of DMate homepage update (IndexNow)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "static/ba35d6e4c10db2df19bf4c02f7d99646.txt"
      - ".github/workflows/notify-bing-indexnow.yml"

permissions:
  contents: read

jobs:
  notify-bing:
    name: Notify Bing once site has deployed IndexNow key
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Wait for publicly accessible verification file
        shell: bash
        run: |
          set -euo pipefail
          KEY="ba35d6e4c10db2df19bf4c02f7d99646"
          KEY_URL="https://dmate.zeabur.app/static/${KEY}.txt"
          echo "Waiting for Zeabur deployment: ${KEY_URL}"
          verified=0
          for attempt in $(seq 1 30); do
            payload="$(curl --silent --show-error --fail --location --max-time 15 "${KEY_URL}" || true)"
            if [ "${payload}" = "${KEY}" ]; then
              echo "IndexNow ownership file verified from public website."
              verified=1
              break
            fi
            echo "Key not live yet, attempt ${attempt}/30."
            sleep 10
          done
          if [ "${verified}" -ne 1 ]; then
            echo "::error::IndexNow key not reachable from the public site; request not sent."
            exit 1
          fi

      - name: Send one IndexNow notification to Bing
        shell: bash
        run: |
          set -euo pipefail
          KEY="ba35d6e4c10db2df19bf4c02f7d99646"
          URL="https://dmate.zeabur.app/"
          KEY_URL="https://dmate.zeabur.app/static/${KEY}.txt"
          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error --location --max-time 30 \
            --get "https://www.bing.com/indexnow" \
            --data-urlencode "url=${URL}" \
            --data-urlencode "key=${KEY}" \
            --data-urlencode "keyLocation=${KEY_URL}" \
            --output "${response_file}" --write-out "%{http_code}")"
          echo "Bing IndexNow HTTP ${http_code}"
          cat "${response_file}"
          echo ""
          case "${http_code}" in
            200) echo "IndexNow: URL notification accepted by Bing." ;;
            202) echo "::warning::IndexNow accepted the request but key validation is pending." ;;
            *) echo "::error::Bing did not accept the notification (HTTP ${http_code})."; exit 1 ;;
          esac
