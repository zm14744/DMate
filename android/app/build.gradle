plugins {
    id 'com.android.application'
}

def releaseKeystore = System.getenv("DMATE_KEYSTORE_PATH")
def hasReleaseSigning = releaseKeystore != null && !releaseKeystore.trim().isEmpty()
def offlineAssets = project.layout.buildDirectory.dir('generated/offlineAssets')
def stageOfflineBundle = tasks.register('stageOfflineBundle', Exec) {
    workingDir rootProject.projectDir.parentFile
    inputs.file new File(rootProject.projectDir.parentFile, 'scripts/stage_native_offline.py')
    inputs.file new File(rootProject.projectDir.parentFile, 'static/offline.html')
    inputs.file new File(rootProject.projectDir.parentFile, 'static/offline-service-worker.js')
    inputs.dir new File(rootProject.projectDir.parentFile, 'static')
    outputs.dir offlineAssets
    commandLine 'python3', 'scripts/stage_native_offline.py', '--destination',
        offlineAssets.get().dir('dmate-offline').asFile.absolutePath
}

android {
    namespace 'app.dmate.client'
    compileSdk 36

    defaultConfig {
        applicationId 'app.dmate.client'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '1.0.3'

        buildConfigField 'String', 'DMATE_URL', '"https://dmate.zeabur.app/"'
        buildConfigField 'String', 'DMATE_USER_AGENT', '"DMateAndroid/1.0.3"'
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets.main.assets.srcDir offlineAssets.get().asFile

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv("DMATE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("DMATE_KEY_ALIAS")
                keyPassword System.getenv("DMATE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named('preBuild').configure { dependsOn stageOfflineBundle }

// Origin-bound JavaScript-to-native image-saving bridge. Web features update from Zeabur.
dependencies {
    implementation "androidx.webkit:webkit:1.16.0"
}
