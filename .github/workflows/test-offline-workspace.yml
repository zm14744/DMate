permissions:
  contents: read

jobs:
  validate:
    # Playwright 1.56.1's pinned Linux browser dependencies support this image.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-agents.txt
      - name: Validate Python syntax
        run: python -m py_compile app.py conversation_titles.py scripts/test_conversation_titles.py scripts/migrate_concept_examples.py scripts/offline_question_classification.py
      - name: Validate offline JavaScript syntax
        run: |
          node --check static/offline.js
          node --check static/offline-entry.js
          node --check static/offline-vault.js
          node --check static/offline-storage.js
          node --check static/appearance-bootstrap.js
          node --check static/offline-appearance-preload.js
          node --check static/offline-handoff.js
          node --check static/offline-service-worker.js
          node --check static/scrollbars.js
          node --check static/mobile-select.js
          node --check static/search-controls.js
          node --check static/offline-shell.js
          node --check static/offline-interface-state.js
          node --check static/offline-privacy-motion.js
          node --check static/offline-backup.js
          node --check static/backup-download.js
          node --check static/online-backup.js
          node --check static/offline-appearance.js
          node --check static/offline-knowledge-graph.js
          node --check static/knowledge-graph-labels.js
