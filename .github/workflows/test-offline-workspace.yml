          node --check scripts/test_wrong_question_previews_browser.cjs
          node --check scripts/test_scrollbar_visibility_browser.cjs
          node --check scripts/test_select_controls_browser.cjs
          node --check scripts/test_search_controls_browser.cjs
          node --check scripts/test_library_panels_browser.cjs
          node --check scripts/test_drawing_controls_browser.cjs
          node --check scripts/test_module_filter_chrome_browser.cjs
          node --check scripts/test_learning_links_browser.cjs
          node --check scripts/test_library_selection_browser.cjs
          node --check scripts/test_library_detail_view_browser.cjs
          node --check scripts/test_drawing_panels_browser.cjs
          node --check scripts/test_responsive_graph_views_browser.cjs
          node --check scripts/test_overlay_zoom_browser.cjs
          node --check scripts/test_math_diagram_browser.cjs
      - name: Test math startup, rendering queue and proof endings
        run: node --test scripts/test_math_markdown.cjs
      - name: Test focused question knowledge relations
        run: node --test scripts/test_question_knowledge_graph.cjs
      - name: Test local conversation title summaries
        run: node --test scripts/test_conversation_titles.cjs
      - name: Verify offline styles match the online workspace
        run: |
          python scripts/sync_offline_styles.py --check
          python scripts/sync_offline_shell.py --check
      - name: Validate JSON content packs
        run: |
          python -m json.tool static/offline-content/concepts.zh-CN.json > /dev/null
          python -m json.tool static/offline-content/questions.zh-CN.json > /dev/null
          python -m json.tool static/offline-content/knowledge_graph.json > /dev/null
      - name: Validate content references
        run: |
          python scripts/sync_offline_content.py --check
          python scripts/migrate_concept_examples.py --check
          python scripts/test_offline_content.py
          python scripts/test_offline_example_migration.py
          python scripts/test_offline_content_math.py
          python scripts/test_offline_translations.py
      - name: Verify service worker precache files exist
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          worker = Path("static/offline-service-worker.js").read_text(encoding="utf-8")
          paths = re.findall(r'"(/(?:offline|static/[^"]+))"', worker)
          missing = [p for p in paths if p != "/offline" and not Path(p.split("?", 1)[0].lstrip("/")).exists()]
          assert not missing, f"Missing precache assets: {missing}"
          print(f"{len(paths)} precache entries checked")
          PY
      - name: Install application and browser dependencies
        run: |
          python -m pip install -r requirements.txt
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps --only-shell chromium
      - name: Verify semantic conversation title summaries without model requests
        run: python -m unittest discover -s scripts -p 'test_conversation_titles.py' -v
      - name: Verify selected concept explanation and relationship counts
        run: python -m unittest discover -s scripts -p 'test_concept_notebook_selection.py' -v
      - name: Verify first-paint appearance uses only the verified current owner
        run: python -m unittest discover -s scripts -p 'test_appearance_bootstrap.py' -v
      - name: Verify the original favicon variants on each platform
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python scripts/test_favicon_consistency.py
      - name: Start the application
        env:
          PORT: '5000'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python app.py > /tmp/dmate-offline-browser-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5000/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dmate-offline-browser-server.log
          exit 1
      - name: Verify chat finalization survives first-render failures
        env:
          DMATE_TEST_BASE_URL: 'http://127.0.0.1:5000'
        run: node scripts/test_chat_finalization_browser.cjs
      - name: Verify packaged offline assets start without browser cache or network
        run: node scripts/test_native_offline_bundle_browser.cjs
      - name: Verify assistant transcript and floating composer
        env:
          DMATE_TEST_BASE_URL: 'http://127.0.0.1:5000'
        run: node scripts/test_chat_surface_browser.cjs
      - name: Verify multi-turn context reaches the chat request
        env:
          DMATE_TEST_BASE_URL: 'http://127.0.0.1:5000'
        run: node scripts/test_conversation_context_browser.cjs
      - name: Exercise the offline workspace and knowledge graph
        env:
          DMATE_TEST_BASE_URL: http://127.0.0.1:5000
          OFFLINE_SCREENSHOT_DIR: artifacts/offline-workspace
          KG_SCREENSHOT_DIR: artifacts/offline-workspace
        run: |
          mkdir -p artifacts/offline-workspace
          node scripts/test_offline_workspace_browser.cjs
