name: Chinese OCR to Solution Differential Regression
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["USTC Discrete Logic Lecture Regression"]
    types: [completed]
permissions:
  contents: read
jobs:
  original-pdf-to-answer:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      DMATE_BENCH_URL: https://dmate.zeabur.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF and HTTP tools
        run: python -m pip install "requests>=2.31,<3" "Pillow>=10,<12" "PyMuPDF>=1.24,<2"
      - name: Verify Python sources
        run: python -m py_compile tests/chinese_university_regression.py
      - name: Real original Chinese PDF OCR followed by DMate solving
        run: |
          python tests/chinese_university_regression.py \
            --images --images-only --delay 14 --timeout 95 --strict \
            --output chinese_ocr_then_solution_results.json
      - name: Preserve OCR, full answer, cropped original scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chinese-ocr-then-solution-evidence
          path: |
            chinese_ocr_then_solution_results.json
            chinese_university_ocr_samples/*.png
          if-no-files-found: warn
          retention-days: 30
