name: Math diagram prototype

on:
  push:
    branches:
      - main
    paths:
      - "app.py"
      - "math_diagram.py"
      - "static/math-diagram.js"
      - "static/drawing-workspace.js"
      - "static/drawing-workspace.css"
      - "templates/index.html"
      - "static/vendor/viz-js-3.31.0/**"
      - "THIRD_PARTY_LICENSES.md"
      - "scripts/test_math_diagram.py"
      - "scripts/test_math_diagram.cjs"
      - ".github/workflows/test-math-diagram.yml"
  pull_request:
    paths:
      - "app.py"
      - "math_diagram.py"
      - "static/math-diagram.js"
      - "static/drawing-workspace.js"
      - "static/drawing-workspace.css"
      - "templates/index.html"
      - "static/vendor/viz-js-3.31.0/**"
      - "THIRD_PARTY_LICENSES.md"
      - "scripts/test_math_diagram.py"
      - "scripts/test_math_diagram.cjs"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install focused test dependencies
        run: |
          python -m pip install networkx jsonschema requests
      - name: Compile and test diagram structure generation
        run: |
          python -m py_compile app.py math_diagram.py
          PYTHONPATH=. python scripts/test_math_diagram.py
      - name: Validate drawing workspace integration syntax
        run: |
          node --check static/math-diagram.js
          node --check static/drawing-workspace.js
      - name: Test real Graphviz WASM layout and editor coordinates
        run: node scripts/test_math_diagram.cjs
