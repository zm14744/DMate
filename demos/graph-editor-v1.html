<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DMate · 图形核对 V1 本地演示</title>
<style>
:root{color-scheme:light;--surface-0:#fff;--surface-1:#fff;--surface-2:#f7f7f8;--surface-3:#eef0f3;--surface-4:#dfe4e9;
--text-primary:#172033;--text-subtle:#667085;--border-strong:#d8dde4;--accent:#2463b2;--accent-bg:#e9f1fa}
body{margin:0;padding:0 16px 40px;font:14px/1.55 Arial,"Microsoft YaHei",sans-serif;background:#f7f7f8;color:var(--text-primary)}
header{max-width:1240px;margin:22px auto 16px;display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
header strong{font-size:20px}header span{color:#667085}
main{max-width:1240px;margin:auto;padding:16px;border:1px solid #d8dde4;border-radius:14px;background:#fff}
#save-status{max-width:1240px;margin:12px auto;color:#4c596d;font-size:13px}
#confirmed-result{white-space:pre-wrap;font:14px/1.8 Arial,"Microsoft YaHei",sans-serif;max-width:1240px;margin:12px auto;padding:12px 16px;border:1px solid #d8dde4;border-radius:10px;background:#fff}
#confirmed-result:empty{display:none}
@media(max-width:600px){header{margin-top:14px}main{padding:9px}body{padding:0 7px 24px}}
.dmate-graph-editor { --dge-border:var(--border-strong,#cbd5e1); --dge-surface:var(--surface-1,#f8fafc); --dge-text:var(--text-primary,#172033); color:var(--dge-text); font:inherit; }
.dmate-graph-editor * { box-sizing:border-box; }
.dmate-graph-editor h3 { font-size:1rem; margin:0 0 12px; }
.dmate-graph-editor button,.dmate-graph-editor input,.dmate-graph-editor select,.dmate-graph-editor textarea { font:inherit; color:inherit; border:1px solid var(--dge-border); border-radius:8px; background:var(--surface-0,#fff); }
.dmate-graph-editor button { padding:8px 12px; cursor:pointer; min-height:38px; }
.dmate-graph-editor button:hover { border-color:var(--accent,#2563eb); }
.dmate-graph-editor button:disabled { opacity:.55; cursor:default; }
.dmate-graph-editor input:not([type=checkbox]),.dmate-graph-editor select,.dmate-graph-editor textarea { padding:8px 10px; width:100%; min-width:0; }
.dmate-graph-editor textarea { resize:vertical; line-height:1.65; }
.dmate-graph-editor input[type=checkbox] { width:18px; height:18px; flex:0 0 18px; accent-color:var(--accent,#2563eb); }
.dmate-graph-editor :focus-visible { outline:2px solid var(--accent,#2563eb); outline-offset:2px; }
.dge-topline,.dge-toolbar,.dge-inline,.dge-actions { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
.dge-topline { margin-bottom:14px; }
.dge-topline p { flex:1 1 400px; margin:0; }
.dge-muted,.dge-node-kind { color:var(--text-subtle,#64748b); font-size:.86rem; line-height:1.55; }
.dge-workspace { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; margin-bottom:16px; }
.dge-original,.dge-visual { border:1px solid var(--dge-border); border-radius:12px; padding:14px; background:var(--dge-surface); min-width:0; }
.dge-original { max-height:390px; overflow:auto; }
.dge-original img { display:block; width:100%; height:auto; background:#fff; border-radius:6px; }
.dge-visual svg { display:block; width:100%; height:auto; max-height:350px; overflow:visible; }
.dge-empty { padding:55px 12px; text-align:center; color:var(--text-subtle,#64748b); }
.dge-field { display:flex; flex-direction:column; gap:5px; font-weight:500; min-width:0; }
.dge-field > span { font-size:.84rem; }
.dge-body { min-height:108px; margin-bottom:6px; }
.dge-toolbar { margin:16px 0; padding:12px; border:1px solid var(--dge-border); border-radius:10px; background:var(--dge-surface); align-items:flex-end; }
.dge-toolbar .dge-field { flex:1 1 140px; }
.dge-context { border:1px solid var(--dge-border); border-radius:9px; padding:10px 12px; margin:10px 0; }
.dge-context summary,.dge-edge-attributes summary,.dge-edge-move summary,.dge-validation summary { cursor:pointer; font-weight:500; }
.dge-context > button { margin:8px 8px 0 0; }
.dge-context-row { padding:12px 0; border-bottom:1px solid var(--dge-border); }
.dge-context-associations { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin:8px 0; }
.dge-context-associations label,.dge-check { display:flex; align-items:center; gap:7px; font-size:.88rem; line-height:1.5; }
.dge-edit-panels { display:grid; grid-template-columns:minmax(200px,.7fr) minmax(0,1.7fr); gap:16px; }
.dge-node-panel,.dge-edge-panel { border:1px solid var(--dge-border); border-radius:12px; padding:14px; min-width:0; }
.dge-node-panel > button { margin:8px 6px 8px 0; }
.dge-node-list { max-height:420px; overflow:auto; margin-bottom:12px; }
.dge-node-row { display:grid; grid-template-columns:20px minmax(65px,1fr); gap:6px; padding:7px; border-radius:8px; margin-bottom:5px; }
.dge-node-row .dge-node-kind { grid-column:2; }
.dge-node-row.is-selected,.dge-edge-row.is-selected { background:var(--accent-bg,#eff6ff); box-shadow:inset 0 0 0 1px var(--accent,#2563eb); }
.dge-inline > input { flex:1 1 100px; width:auto!important; }

.dge-edge-select { grid-column:1 / -1; justify-self:start; background:transparent!important; border:0!important; padding:0!important; min-height:24px!important; font-weight:600!important; }
.dge-edge-attributes { grid-column:1 / -1; font-size:.86rem; }
.dge-edge-attributes .dge-field { margin-top:8px; }
.dge-danger { color:var(--text-primary,#334155)!important; }
.dge-danger:hover { border-color:#dc2626!important; color:#b91c1c!important; }
.dge-edge-move { border-top:1px solid var(--dge-border); padding-top:12px; margin-top:12px; }

.dge-edge-move .dge-field { flex:1; }
.dge-status { min-height:25px; margin:12px 0 0; line-height:1.5; font-size:.9rem; }
.dge-validation { padding:10px 14px; border:1px solid #d97706; border-radius:9px; font-size:.88rem; margin-top:8px; }
.dge-validation ul { padding-left:20px; margin:8px 0 0; max-height:130px; overflow:auto; }
.dge-observations { padding:10px 14px; margin-bottom:12px; border:1px solid var(--dge-border); border-radius:9px; font-size:.88rem; }
.dge-observations summary { cursor:pointer; font-weight:600; }
.dge-observations ul { margin:8px 0 0; padding-left:20px; line-height:1.6; max-height:120px; overflow:auto; }
.dge-footer { position:sticky; bottom:0; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px; padding:14px 0 2px; margin-top:12px; border-top:1px solid var(--dge-border); background:var(--surface-2,#fff); z-index:2; }
.dge-primary { background:var(--accent,#2563eb)!important; border-color:var(--accent,#2563eb)!important; color:#fff!important; font-weight:600!important; }
.dge-edge-stroke { stroke:var(--text-subtle,#64748b); stroke-width:2.2; }
.dge-edge-hit { stroke:transparent; stroke-width:16; }
.dge-visual-edge,.dge-visual-node { cursor:pointer; }
.dge-visual-edge.is-selected .dge-edge-stroke { stroke:var(--accent,#2563eb)!important; stroke-width:4; }
.dge-edge-label { fill:var(--dge-text); paint-order:stroke; stroke:var(--dge-surface); stroke-width:4; stroke-linejoin:round; font-size:14px; }
.dge-visual-node circle { fill:var(--surface-0,#fff); stroke:var(--text-subtle,#64748b); stroke-width:2; }
.dge-visual-node text { fill:var(--dge-text); font-size:14px; pointer-events:none; }
.dge-visual-node.is-selected circle { fill:var(--accent-bg,#dbeafe); stroke:var(--accent,#2563eb); stroke-width:3; }
@media (max-width:760px) {
 .dge-workspace,.dge-edit-panels { grid-template-columns:1fr; }

}
@media (max-width:420px) { .dge-edge-row { grid-template-columns:repeat(2,minmax(0,1fr)); } .dge-toolbar .dge-field { flex-basis:100%; } }

/* Original-image editor: monochrome controls and a single subdued drawing color. */
.dge-workspace:has(.dge-overlay-host){display:block}
.dge-overlay-host{min-width:0;border:1px solid var(--dge-border);border-radius:12px;background:var(--dge-surface);overflow:hidden}
.dge-overlay-tools{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:9px;border-bottom:1px solid var(--dge-border);background:var(--surface-1,#fff)}
.dge-overlay-tools button,.dge-overlay-tools select{font-size:13px;width:auto;flex:0 0 auto;border-radius:7px;padding:7px 10px;min-height:34px}
.dge-overlay-tools button.is-active{background:var(--accent-bg,#eaf2ff);border-color:var(--accent,#2563eb)}
.dge-overlay-tools select{max-width:152px}
.dge-overlay-zoom{font-size:12px;color:var(--text-subtle,#64748b);min-width:42px;text-align:center}
.dge-overlay-viewport{background:var(--surface-2,#f3f4f6);max-height:min(63dvh,700px);min-height:220px;overflow:auto;overscroll-behavior:contain}
.dge-overlay-stage{position:relative;width:100%;min-width:100%;margin:0 auto;background:white}
.dge-overlay-image{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;background:#fff}
.dge-overlay-svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;overflow:visible;color:var(--accent,#2563eb);cursor:crosshair}
.dge-overlay-svg.is-hidden{pointer-events:none;visibility:hidden}
.dge-overlay-edge{cursor:pointer;color:var(--accent,#2563eb)}
.dge-overlay-hit{stroke:transparent;stroke-width:17px;fill:none;pointer-events:stroke}
.dge-overlay-stroke{stroke:currentColor;stroke-width:3px;fill:none;opacity:.8;pointer-events:none;stroke-linecap:round;stroke-linejoin:round}
.dge-overlay-edge.is-selected .dge-overlay-stroke{stroke-width:5px;opacity:1}
.dge-overlay-edge.is-uncertain .dge-overlay-stroke{stroke-dasharray:7 5;opacity:.5}
.dge-overlay-node{cursor:pointer}
.dge-overlay-node-hit{fill:transparent;pointer-events:all}
.dge-overlay-dot{fill:var(--surface-0,#fff);stroke:var(--accent,#2563eb);stroke-width:3px;pointer-events:none}
.dge-overlay-node.is-selected .dge-overlay-dot{stroke-width:5px}
.dge-overlay-node.is-estimated .dge-overlay-dot{stroke-dasharray:4 3;opacity:.65}
.dge-overlay-label{fill:var(--text-primary,#182334);paint-order:stroke;stroke:var(--surface-0,#fff);stroke-width:4px;stroke-linejoin:round;font-size:16px;pointer-events:none;font-family:inherit}
.dge-overlay-bbox{fill:none;stroke:var(--accent,#2563eb);stroke-width:2px;stroke-dasharray:9 7;pointer-events:none;opacity:.6}
.dge-overlay-handle{fill:var(--surface-0,#fff);stroke:var(--accent,#2563eb);stroke-width:3px;cursor:move}
.dge-overlay-pending,.dge-overlay-selection{fill:rgba(59,130,246,.08);stroke:var(--accent,#2563eb);stroke-width:3px;stroke-dasharray:6 4;pointer-events:none}
.dge-overlay-hint{margin:0;padding:9px 14px;font-size:12px;color:var(--text-subtle,#64748b)}
.dge-overlay-status{display:block;font-size:12px;padding:0 14px 7px;color:var(--text-subtle,#64748b)}
.dge-overlay-status:empty{display:none}
@media(max-width:760px){.dge-overlay-tools{gap:4px;padding:7px}.dge-overlay-tools button,.dge-overlay-tools select{padding:6px 7px;font-size:12px}.dge-overlay-viewport{max-height:55dvh;min-height:200px}.dge-overlay-hint{padding:8px 10px}}

.dge-review-summary{border:1px solid var(--dge-border);border-radius:10px;margin:12px 0;background:var(--surface-1,#fff);overflow:hidden}
.dge-review-summary>summary{cursor:pointer;padding:11px 14px;font-weight:600;font-size:14px}
.dge-review-content{padding:0 14px 12px;font-size:14px;line-height:1.7}
.dge-review-content p{margin:5px 0}
.dge-review-content .dge-review-type{font-weight:600}
.dge-review-content .dge-review-subhead{margin-top:10px;font-weight:600}
.dge-review-relation{display:block!important;padding:3px 8px!important;margin:3px 0!important;min-height:26px!important;border:1px solid transparent!important;background:transparent!important;border-radius:5px;text-align:left;font-size:13px!important}
.dge-review-relation:hover,.dge-review-relation.is-selected{background:var(--accent-bg,#eaf2ff)!important;border-color:var(--accent,#2563eb)!important}

/* V1 review: one central image, contextual properties, advanced tables on demand. */
.dge-workspace:has(.dge-overlay-host){
 display:grid;grid-template-columns:minmax(0,1fr) minmax(242px,280px);
 gap:12px;align-items:start;
}
.dge-selection-panel{
 min-width:0;padding:16px;border:1px solid var(--dge-border);
 border-radius:12px;background:var(--surface-1,#fff);
 display:flex;flex-direction:column;gap:12px;
}
.dge-selection-panel h3{margin:0 0 2px;font-size:14px}
.dge-selection-panel .dge-field{gap:5px}
.dge-selection-panel .dge-muted{margin:0}
.dge-selection-panel .dge-danger{margin-top:4px}
.dge-advanced-panel{border:1px solid var(--dge-border);border-radius:10px;margin:14px 0}
.dge-advanced-panel>summary{padding:13px 16px;cursor:pointer;font-size:13px}
.dge-advanced-panel>.dge-edit-panels{padding:0 12px 14px}
@media(max-width:760px){
 .dge-workspace:has(.dge-overlay-host){grid-template-columns:1fr;gap:8px}
 .dge-selection-panel{padding:12px;gap:8px}
 .dge-selection-panel .dge-field{flex:1 1 140px}
}

/* Labels are always drawn over the unchanged (usually white) photograph. */
.dge-overlay-label{fill:#172033;stroke:#fff}
.dge-overlay-svg[data-mode="pan"]{cursor:grab}
.dge-overlay-node:active,.dge-overlay-svg[data-mode="pan"]:active{cursor:grabbing}

</style></head>
<body><header><strong>DMate · 图形核对</strong><span>V1 独立体验页面 · 离线运行</span></header>
<main id="editor"></main><p id="save-status">这是自带示例图的真实编辑器，本演示不调用 AI、不上传图片、不修改 GitHub 或线上数据。关闭页面后修改不会保留。</p>
<pre id="confirmed-result"></pre>
<script>
(function (root) {
    'use strict';
    const LIMITS = { graphs: 64, vertices: 100, edges: 300, body: 23000 };
    const copy = value => JSON.parse(JSON.stringify(value));
    const scalar = value => typeof value === 'string' || (typeof value === 'number' && Number.isFinite(value));
    const id = value => scalar(value) ? String(value) : '';
    const text = value => scalar(value) ? String(value) : '';
    const unique = (prefix, records) => {
        const used = new Set(records.map(row => row.id));
        let next = 1;
        while (used.has(prefix + next)) next++;
        return prefix + next;
    };
    const ATTRS = ['weight', 'edge_label', 'color', 'style'];
    const unit = value => typeof value === 'number' && Number.isFinite(value) && value >= 0 && value <= 1;
    const point = value => Array.isArray(value) && value.length === 2 && value.every(unit);
    const validPath = value => Array.isArray(value) && value.length >= 2 && value.length <= 128 && value.every(point);
    const validBox = value => Array.isArray(value) && value.length === 4 && value.every(unit) && value[0] < value[2] && value[1] < value[3];
    const ring = number => number >= 1 && number <= 20 ? '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳'[number - 1] : '未命名' + number;
    function ensureAnonymousLabels(input) {
        const draft = copy(input);
        for (const graph of draft.graphs || []) {
            const used = new Set((graph.vertices || []).map(v => v.label || v.display_label).filter(Boolean));
            let next = Math.max(1, Number.isInteger(graph.anon_next) ? graph.anon_next : 1);
            const circleNames = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
            for (const name of used) {
                const at = circleNames.indexOf(String(name));
                if (at >= 0 && String(name).length === 1) next = Math.max(next, at + 2);
                const match = /^未命名(\d+)$/.exec(String(name));
                if (match) next = Math.max(next, Number(match[1]) + 1);
            }
            for (const vertex of graph.vertices || []) {
                if (vertex.label || vertex.display_label) continue;
                let display;
                do { display = ring(next++); } while (used.has(display));
                vertex.display_label = display;
                used.add(display);
            }
            graph.anon_next = next;
        }
        return draft;
    }

    function importDocument(input) {
        const source = input && typeof input === 'object' ? input : {};
        const result = { body_text: text(source.body_text), graphs: [] };
        for (const raw of Array.isArray(source.graphs) ? source.graphs : []) {
            if (!raw || typeof raw !== 'object') continue;
            const graph = { id: id(raw.id) || unique('G', result.graphs), name: text(raw.name), vertices: [], edges: [] };
            if (typeof raw.directed === 'boolean') graph.directed = raw.directed;
            if (typeof raw.weighted === 'boolean') graph.weighted = raw.weighted;
            if (validBox(raw.bbox)) graph.bbox = [...raw.bbox];
            if (Number.isInteger(raw.anon_next) && raw.anon_next >= 1 && raw.anon_next <= 10000) graph.anon_next = raw.anon_next;
            if (result.graphs.some(row => row.id === graph.id)) graph.id = unique('G', result.graphs);
            const inputVertices = Array.isArray(raw.vertices) ? raw.vertices.filter(row => row && typeof row === 'object') : [];
            const oldCounts = new Map();
            inputVertices.forEach(row => oldCounts.set(id(row.id), (oldCounts.get(id(row.id)) || 0) + 1));
            const aliases = new Map();
            for (const rawVertex of inputVertices) {
                let vertexId = id(rawVertex.id) || unique('v', graph.vertices);
                if (graph.vertices.some(row => row.id === vertexId)) vertexId = unique('v', graph.vertices);
                const vertex = { id: vertexId, label: scalar(rawVertex.label) && text(rawVertex.label).trim() ? text(rawVertex.label) : null };
                if (unit(rawVertex.x) && unit(rawVertex.y)) { vertex.x = rawVertex.x; vertex.y = rawVertex.y; }
                if (typeof rawVertex.display_label === 'string' && rawVertex.display_label.length <= 16 && rawVertex.display_label) vertex.display_label = rawVertex.display_label;
                graph.vertices.push(vertex);
                if (id(rawVertex.id) && oldCounts.get(id(rawVertex.id)) === 1) aliases.set(id(rawVertex.id), vertexId);
            }
            for (const rawEdge of Array.isArray(raw.edges) ? raw.edges : []) {
                if (!rawEdge || typeof rawEdge !== 'object') continue;
                let edgeId = id(rawEdge.id) || unique('e', graph.edges);
                if (graph.edges.some(row => row.id === edgeId)) edgeId = unique('e', graph.edges);
                const endpoint = value => aliases.get(id(value)) || (oldCounts.has(id(value)) ? '' : id(value));
                const edge = { id: edgeId, from: endpoint(rawEdge.from), to: endpoint(rawEdge.to),
                    direction: ['forward', 'undirected', 'unknown'].includes(rawEdge.direction) ? rawEdge.direction
                        : raw.directed === true ? 'forward' : raw.directed === false ? 'undirected' : 'unknown' };
                for (const field of ATTRS) if (rawEdge[field] === null || scalar(rawEdge[field])) edge[field] = rawEdge[field];
                if (rawEdge.weight !== undefined && rawEdge.weight !== null && !scalar(rawEdge.weight)) edge.weight = 'unknown';
                if (validPath(rawEdge.path)) edge.path = rawEdge.path.map(row => [...row]);
                graph.edges.push(edge);
            }
            result.graphs.push(graph);
        }
        if (source.text_context && typeof source.text_context === 'object') {
            const context = {};
            for (const field of ['legends', 'captions']) {
                context[field] = (Array.isArray(source.text_context[field]) ? source.text_context[field] : [])
                    .filter(row => row && typeof row.text === 'string')
                    .map(row => ({ text: row.text, graph_ids: Array.isArray(row.graph_ids) ? row.graph_ids.map(id) : [] }));
            }
            if (context.legends.length || context.captions.length) result.text_context = context;
        }
        return result;
    }

    function validateDocument(document) {
        const issues = [];
        if (!document || typeof document.body_text !== 'string' || !Array.isArray(document.graphs)) return ['题目结构无法读取。'];
        if (document.body_text.length > LIMITS.body) issues.push('题干过长，请精简至 23000 字以内。');
        if (!document.body_text.trim() && !document.graphs.length) issues.push('请至少填写题干或添加一幅图。');
        if (document.graphs.length > LIMITS.graphs) issues.push('子图数量超过 64 幅。');
        const graphIds = new Set();
        for (const [number, graph] of document.graphs.entries()) {
            const name = graph.name || '图 ' + (number + 1);
            if (!graph.id || graphIds.has(graph.id)) issues.push(name + '的编号重复或为空。');
            graphIds.add(graph.id);
            if (!graph.vertices.length) issues.push(name + '没有节点；请添加节点或删除这幅空图。');
            if (graph.vertices.length > LIMITS.vertices || graph.edges.length > LIMITS.edges) issues.push(name + '超出编辑范围（100 个节点、300 条边）。');
            if (graph.bbox !== undefined && !validBox(graph.bbox)) issues.push(name + '的框选区域无效。');
            const vertices = new Set(), edges = new Set();
            for (const vertex of graph.vertices) {
                if (!vertex.id || vertices.has(vertex.id)) issues.push(name + '有重复或缺失的节点编号。');
                vertices.add(vertex.id);
                if (vertex.label !== null && typeof vertex.label !== 'string') issues.push(name + '有无效节点标签。');
                if (text(vertex.label).length > 128) issues.push(name + '的节点标签超过 128 字。');
