name: Verify DMate Exercise Generation

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'teaching.py'
      - 'ai.py'
      - 'concept_notebook.py'
      - 'proof_writing.py'
      - 'proof_writing_extended.py'
      - 'docs/PROOF_WRITING_STANDARD.md'
      - 'docs/PROOF_WRITING_STANDARD.en.md'
      - 'scripts/test_proof_writing.py'
      - 'exercise_relation_check.py'
      - 'exercise_intent.py'
      - 'static/exercise-intent-rules.json'
      - 'scripts/test_exercise_generation_regression.py'
      - '.github/workflows/test-exercise-generation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exercise-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile proof-writing integrations
        run: python -m py_compile ai.py concept_notebook.py proof_writing.py proof_writing_extended.py
      - name: Run offline exercise regressions
        run: python -m unittest discover -s scripts -p 'test_exercise_generation_regression.py' -v
      - name: Run proof-writing policy regressions
        run: python -m unittest discover -s scripts -p 'test_proof_writing.py' -v
