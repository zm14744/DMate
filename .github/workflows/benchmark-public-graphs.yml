name: Public Graph Diagram Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/benchmark_public_graph_images.py"
      - "scripts/benchmark_public_dot_graphs.py"
      - "graph_recognition.py"
      - "graph_recognition_v2.py"
      - ".github/workflows/benchmark-public-graphs.yml"
  pull_request:
    paths:
      - "scripts/benchmark_public_graph_images.py"
      - "scripts/benchmark_public_dot_graphs.py"
      - "graph_recognition.py"
      - "graph_recognition_v2.py"
      - ".github/workflows/benchmark-public-graphs.yml"

permissions:
  contents: read

jobs:
  real-world-images:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight graph/image dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq graphviz
          python -m pip install "numpy<2" "Pillow>=10,<12" "opencv-python-headless==4.10.0.84" "requests>=2.31" "cairosvg>=2.7"
      - name: Render and test 15 public Graphviz diagrams in three conditions
        run: python scripts/benchmark_public_dot_graphs.py
      # Wikimedia rate-limits shared runners with HTTP 429. Do not hammer
      # Commons on every push. The 26-source catalog remains in the repository
      # for occasional manual auditing when permitted.
