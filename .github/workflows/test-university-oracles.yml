name: Validate University Answer Oracles
on:
  push:
    branches: [main]
    paths:
      - "tests/university_verified_cases.json"
      - "tests/university_answer_benchmark.py"
      - "tests/test_university_oracles.py"
      - ".github/workflows/test-university-oracles.yml"
  pull_request:
    paths:
      - "tests/university_verified_cases.json"
      - "tests/university_answer_benchmark.py"
      - "tests/test_university_oracles.py"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "requests>=2.31,<3"
      - run: PYTHONPATH=. python -m unittest discover -s tests -p "test_university_oracles.py" -v
