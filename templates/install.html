<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8fafc">
  <meta name="description" content="安装 DMate 离散数学智能辅学系统。">
  <link rel="manifest" href="/manifest.webmanifest?v={% if is_android %}dmate-mobile-maskable-v24-20261019{% else %}dmate-pwa-v22-20261019{% endif %}">
  <link rel="icon" type="image/svg+xml" href="/static/icons/dmate-favicon-mac.svg?v=dmate-fixed-v22-20261019">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png?v=dmate-pwa-v22-20261019">
  <link rel="apple-touch-icon" sizes="192x192" href="/static/icons/icon-192.png?v=dmate-pwa-v22-20261019">
  <title>安装 DMate</title>
  <style>
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; min-height:100dvh; padding:20px;
      display:grid; place-items:center; background:#f3f5f9; color:#172033;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    main {
      width:min(100%,480px); padding:26px; border:1px solid #e0e5ed;
      border-radius:22px; background:#fff; box-shadow:0 16px 44px rgba(15,23,42,.08);
    }
    .brand { display:flex; align-items:center; gap:14px; margin-bottom:24px; }
    .brand img { width:60px; height:60px; border-radius:14px; flex:0 0 auto; }
    h1 { margin:0 0 5px; font-size:25px; line-height:1.2; }
    .subtitle { margin:0; color:#64748b; font-size:14px; }
    .hint { margin:0 0 18px; color:#475569; font-size:16px; line-height:1.6; }
    button {
      display:flex; width:100%; min-height:52px; align-items:center; justify-content:center;
      padding:12px 16px; border:0; border-radius:12px; background:#2563eb; color:#fff;
      font:inherit; font-weight:650; cursor:pointer;
    }
    button[hidden] { display:none; }
    @media (max-width:480px) {
      body { padding:14px; }
      main { padding:21px; border-radius:18px; }
      .brand img { width:52px; height:52px; }
      h1 { font-size:23px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <img src="/static/icons/icon-192.png?v=dmate-pwa-v22-20261019" alt="DMate 图标">
      <div>
        <h1>安装 DMate</h1>
        <p class="subtitle">离散数学智能辅学系统</p>
      </div>
    </div>
    <button id="installNow" type="button" hidden>安装 DMate</button>
    <p id="installHint" class="hint" aria-live="polite">正在检查安装支持……</p>
  </main>
  <script>
    let deferredInstallPrompt = null;
    const installButton = document.getElementById("installNow");
    const installHint = document.getElementById("installHint");
    const ua = navigator.userAgent || "";
    const platform = navigator.platform || "";
    const isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Mac/i.test(platform) && Number(navigator.maxTouchPoints || 0) > 1);
    const isMacSafari = /Macintosh|Mac OS X/i.test(ua) && /Safari/i.test(ua) && !/Chrome|Chromium|Edg/i.test(ua);
    const isAndroid = /Android/i.test(ua);
    const browserName = (() => {
      if (/baiduboxapp|baidubrowser/i.test(ua)) return "百度浏览器";
      if (/quark/i.test(ua)) return "夸克浏览器";
      if (/ucbrowser|ucweb/i.test(ua)) return "UC 浏览器";
      if (/qqbrowser/i.test(ua)) return "QQ 浏览器";
      if (/micromessenger/i.test(ua)) return "微信内置浏览器";
      if (/alipayclient/i.test(ua)) return "支付宝内置浏览器";
      if (/miuibrowser/i.test(ua)) return "小米浏览器";
      if (/huaweibrowser/i.test(ua)) return "华为浏览器";
      if (/heytapbrowser|oppobrowser/i.test(ua)) return "OPPO 浏览器";
      if (/vivobrowser/i.test(ua)) return "vivo 浏览器";
      if (/honorbrowser/i.test(ua)) return "荣耀浏览器";
      if (/samsungbrowser/i.test(ua)) return "三星浏览器";
      if (/edgios|edga|edg\//i.test(ua)) return "Microsoft Edge";
      if (/fxios|firefox/i.test(ua)) return "Firefox";
      if (/crios|chrome/i.test(ua)) return "Chrome";
      if (/safari/i.test(ua)) return "Safari";
      return isAndroid ? "手机浏览器" : "当前浏览器";
    })();

    if (isIOS) {
      installHint.textContent = /Safari/i.test(ua) && !/Chrome|CriOS|EdgiOS|FxiOS/i.test(ua)
        ? "点 Safari 的“分享”→“添加到主屏幕”。"
        : "请用 Safari 打开，再点“分享”→“添加到主屏幕”。";
    } else if (isMacSafari) {
      installHint.textContent = "Safari 菜单栏选择“文件”→“添加到程序坞”。";
    } else if (isAndroid && /micromessenger|alipayclient/i.test(ua)) {
      installHint.textContent = browserName + "暂不支持直接安装，请在菜单中选择“在浏览器打开”。";
    } else if (isAndroid && /Firefox/i.test(ua)) {
      installHint.textContent = "打开 Firefox 菜单，选择“安装”或“添加到主屏幕”。";
    } else if (isAndroid) {
      installHint.textContent = "打开浏览器菜单，选择“安装应用”或“添加到主屏幕”。";
    } else if (/Chrome|Chromium|Edg\//i.test(ua)) {
      installHint.textContent = "打开浏览器菜单，选择“安装 DMate”。";
    } else {
      installHint.textContent = "请在浏览器菜单中查找“安装应用”或“添加到主屏幕”。";
    }

    window.addEventListener("beforeinstallprompt", event => {
      event.preventDefault();
      deferredInstallPrompt = event;
      installButton.hidden = false;
      installHint.textContent = "点击“安装 DMate”并确认即可。";
    });

    installButton.addEventListener("click", async () => {
      if (!deferredInstallPrompt) return;
      const promptEvent = deferredInstallPrompt;
      deferredInstallPrompt = null;
      await promptEvent.prompt();
      const choice = await promptEvent.userChoice.catch(() => null);
      installButton.hidden = true;
      installHint.textContent = choice && choice.outcome === "accepted"
        ? "DMate 已开始安装。"
        : "未完成安装，可在浏览器菜单中重试。";
    });

    window.addEventListener("appinstalled", () => {
      installButton.hidden = true;
      installHint.textContent = "DMate 已安装。";
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/service-worker.js", { scope:"/" }).catch(() => {});
    }
  </script>
</body>
</html>
