name: Verify Deployed Graph Safety v4
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-deployed-graph-v4.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-graph-safety:
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - name: Check the current Zeabur graph-image and answer guard release
        env:
          DMATE_HEALTH_URL: https://dmate.zeabur.app/health
        run: |
          python - <<'PY'
          import json, os, sys, time, urllib.request
          expected_graph="2026-10-20-v4-independent-directed-and-multigraph-vertex-audit"
          expected_answer="2026-10-20-v1-fail-closed-university-diagrams"
          for attempt in range(3):
              try:
                  req=urllib.request.Request(os.environ["DMATE_HEALTH_URL"],
                                              headers={"User-Agent":"DMate-University-Audit-CI"})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      data=json.load(r)
                  print("LIVE_HEALTH",json.dumps(data,ensure_ascii=False),flush=True)
                  if (data.get("graph_image_audit_version")==expected_graph and
                      data.get("graph_answer_integrity_version")==expected_answer):
                      print("GRAPH_SAFETY_V4_DEPLOYED",flush=True)
                      sys.exit(0)
                  print("STALE_DEPLOYMENT",attempt+1,flush=True)
              except Exception as exc:
                  print("LIVE_HEALTH_ERROR",type(exc).__name__,str(exc)[:150],flush=True)
              if attempt<2:time.sleep(25)
          print("GRAPH_SAFETY_V4_NOT_DEPLOYED_OR_UNVERIFIED",flush=True)
          sys.exit(2)
          PY
