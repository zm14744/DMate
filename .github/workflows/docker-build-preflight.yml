name: Production model-cache build preflight

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'ocr_runtime.py'
      - 'image_upload_limits.py'
      - 'scripts/prepare_ocr_model_cache.py'
      - 'requirements*.txt'
      - 'tests/test_docker_build_imports.py'
      - 'tests/test_prepare_ocr_model_cache.py'
      - '.github/workflows/docker-build-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache-layer-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install only build-preflight test dependencies
        run: python -m pip install pytest==8.4.2 requests==2.32.5 PyYAML==6.0.3
      - name: Replay isolated pre-cache sources and verify cache integrity contracts
        run: python -m pytest -q tests/test_docker_build_imports.py tests/test_prepare_ocr_model_cache.py
