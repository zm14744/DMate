name: Build DMate Android Release

# Publish the signed APK to the existing multi-platform release so the public
# download URL actually receives native WebView fixes, not just old v1.0.1.
permissions:
  contents: write
concurrency:
  group: dmate-android-release-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-release.yml'

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Restore release keystore
        shell: bash
        run: |
          printf '%s' "${{ secrets.DMATE_ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/dmate-release.jks"
          echo "DMATE_KEYSTORE_PATH=$RUNNER_TEMP/dmate-release.jks" >> "$GITHUB_ENV"
          echo "DMATE_KEYSTORE_PASSWORD=${{ secrets.DMATE_ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "DMATE_KEY_ALIAS=${{ secrets.DMATE_ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "DMATE_KEY_PASSWORD=${{ secrets.DMATE_ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Check mobile image picker integration
        run: |
          python -m unittest discover -s tests -p 'test_android_upload_ui_contract.py'
          node --check static/script.js
          node --check static/graph-editor.js
          node --check static/graph-editor-overlay.js

      - name: Build signed release APK
        working-directory: android
        run: gradle assembleRelease --stacktrace

      - name: Prepare release file
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/DMate.apk

      - name: Verify signed release artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/DMate.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose dist/DMate.apk
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          apk = Path("dist/DMate.apk")
          with ZipFile(apk) as zipped:
              assert "AndroidManifest.xml" in zipped.namelist()
              assert zipped.testzip() is None
          print(f"Verified signed Android APK: {apk.stat().st_size} bytes")
          PY

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: DMate-release-apk
          path: dist/DMate.apk
          if-no-files-found: error
          retention-days: 30

      # This tag also holds Windows/macOS/Linux assets; replacing only DMate.apk
      # preserves the desktop downloads and the releases/latest/download URLs.
      - name: Publish signed APK to existing GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload v1.0.1 dist/DMate.apk --clobber --repo "$GITHUB_REPOSITORY"
          gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | select(.name=="DMate.apk") | {name, size, updatedAt}'
