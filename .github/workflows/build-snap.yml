name: Build DMate Snap (GitHub)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snap:
    name: Build Linux Snap (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout DMate
        uses: actions/checkout@v4

      - name: Generate platform-specific icons
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python scripts/generate_icons.py

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf xdg-utils libxdo-dev file

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './desktop/src-tauri -> target'

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build Linux DEB from current source
        working-directory: desktop
        run: cargo tauri build --bundles deb

      - name: Prepare Snap build inputs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t packages < <(find desktop/src-tauri/target -type f -path '*/release/bundle/deb/*.deb' -print0)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "::error::Expected one Tauri Debian package; found ${#packages[@]}."
            printf '%s\n' "${packages[@]}" >&2
            exit 1
          fi
          package="${packages[0]}"
          version="$(dpkg-deb --field "$package" Version)"
          arch="$(dpkg-deb --field "$package" Architecture)"
          echo "Checking DEB: $package (version=$version, architecture=$arch)"
          if [[ "$version" != "1.0.2" ]]; then
            echo "::error::Expected Debian version 1.0.2; found $version."
            exit 1
          fi
          if [[ "$arch" != "amd64" ]]; then
            echo "::error::Expected Debian architecture amd64; found $arch."
            exit 1
          fi
          # Tauri archives can list "usr/bin/..." without a leading "./".
          # Check the extracted filesystem, not dpkg-deb's display formatting.
          # No pipe to grep -q: this also avoids the previous SIGPIPE failure.
          check_dir="$(mktemp -d)"
          trap 'rm -rf -- "$check_dir"' EXIT
          dpkg-deb --extract "$package" "$check_dir"
          executable="$check_dir/usr/bin/dmate-desktop"
          if [[ ! -f "$executable" || ! -x "$executable" ]]; then
            echo "::error::The Debian package must contain an executable usr/bin/dmate-desktop."
            dpkg-deb --contents "$package"
            exit 1
          fi
          file "$executable"
          cp "$package" DMate_1.0.2_amd64.deb
          # Use the freshly generated 512px icon for high-density launchers.
          mkdir -p snap/gui
          cp desktop/src-tauri/icons/icon.png snap/gui/dmate.png
          echo "Verified DEB and icon are ready for Snapcraft."

      - name: Build Snap on GitHub runner
        id: snapcraft
        uses: canonical/action-build@v1

      - name: Check Snap output
        shell: bash
        env:
          SNAP_PATH: ${{ steps.snapcraft.outputs.snap }}
        run: |
          set -euo pipefail
          test -f "$SNAP_PATH"
          ls -lh "$SNAP_PATH"
          sha256sum "$SNAP_PATH"

      - name: Save Snap for download
        uses: actions/upload-artifact@v4
        with:
          name: DMate-linux-snap-amd64
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error
          retention-days: 30

      - name: Preserve DEB for diagnosis if packaging fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DMate-snap-debug-inputs
          path: |
            desktop/src-tauri/target/**/release/bundle/deb/*.deb
            snap/snapcraft.yaml
          if-no-files-found: warn
          retention-days: 7
