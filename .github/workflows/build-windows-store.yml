name: Build and Publish Microsoft Store Packages

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Retry only: original run with a verified Store artifact (leave empty to build)'
        required: false
        type: string
      expected_head_sha:
        description: 'Retry only: reviewed full commit SHA of the original run'
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: dmate-github-release-assets
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'zm14744/DMate' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image generation dependency
        if: inputs.source_run_id == ''
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Cache official fixed WebView2 runtime
        if: inputs.source_run_id == ''
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dmate-store-runtime-cache
          key: dmate-store-webview2-157.0.4341.42-x64
      - name: Restore the original verified artifact for a publication retry
        if: inputs.source_run_id != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          STORE_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          STORE_EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: >-
          python scripts/windows_store_release.py restore
          --repository "$env:GITHUB_REPOSITORY"
          --run-id "$env:STORE_SOURCE_RUN_ID"
          --expected-head-sha "$env:STORE_EXPECTED_HEAD_SHA"
          --directory dist/windows-store
      - name: Prepare, package and verify both Store formats
        if: inputs.source_run_id == ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/build_windows_store.ps1
      - name: Install, launch and upgrade the verified Store packages
        if: inputs.source_run_id == ''
        shell: powershell
        timeout-minutes: 8
        env:
          DMATE_STORE_SMOKE_RUNNER: ${{ runner.environment }}
        run: ./scripts/build_windows_store.ps1 -InstallSmoke
      - name: Save Store submission files
        if: inputs.source_run_id == ''
        uses: actions/upload-artifact@v4
        with:
          name: DMate-Microsoft-Store-Packages
          path: dist/windows-store/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified submission files to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/build_windows_store.ps1 -PublishOnly
