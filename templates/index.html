@media (max-width:700px) {
    .wrong-toolbar {
        align-items:flex-start;
        flex-direction:column;
    }

    .wrong-filter-group {
        align-items:flex-start;
        flex-direction:column;
    }

    .wrong-actions {
        flex-wrap:wrap;
    }

    .graph-toolbar {
        align-items:flex-start;
        flex-direction:column;
    }

    .graph-summary {
        align-items:flex-start;
        flex-direction:column;
    }

    .graph-summary-item {
        max-width:100%;
    }

    .graph-summary-value {
        max-width:220px;
    }

    .knowledge-graph-layout {
        grid-template-columns:1fr;
    }

    .knowledge-graph-main {
        border-right:none;
        border-bottom:1px solid var(--surface-3);
    }
}


/* =========================================================
   外观系统：仅影响视觉表现，不参与任何学习/会话业务状态
   ========================================================= */
:root {
    --panel-alpha:1;
    --bubble-alpha:1;
    --font-scale:1;
    --font-base:calc(16px * var(--font-scale));
    --font-small:calc(13px * var(--font-scale));
    --font-xs:calc(12px * var(--font-scale));
    --font-xxs:calc(11px * var(--font-scale));

    --surface-0:#0f172a;
    --surface-0-rgb:15,23,42;
    --surface-1:rgba(11,18,32,var(--panel-alpha));
    --surface-1-rgb:11,18,32;
    --surface-2:rgba(17,24,39,var(--panel-alpha));
    --surface-2-rgb:17,24,39;
    --surface-3:rgba(31,41,55,var(--panel-alpha));
    --surface-3-rgb:31,41,55;
    --surface-4:rgba(38,52,73,var(--panel-alpha));
    --surface-4-rgb:38,52,73;

    --border-strong:#334155;
    --border-mid:#475569;
    --text-strong:#f8fafc;
    --text-primary:#e2e8f0;
    --text-secondary:#cbd5e1;
    --text-muted:#94a3b8;
    --text-subtle:#64748b;

    --accent:#3b82f6;
    --accent-rgb:59,130,246;
    --accent-deep:#2563eb;
    --accent-deeper:#1d4ed8;
    --accent-soft:#60a5fa;
    --accent-pale:#93c5fd;
    --accent-bg:rgba(59,130,246,.22);
    --accent-text:#eff6ff;

    --background-mask-rgb:15,23,42;
    --background-mask-alpha:.35;
    --background-blur:0px;
    --background-size:cover;
}

body[data-appearance-theme="light"] {
    --surface-0:#eef3f8;
    --surface-0-rgb:238,243,248;
    --surface-1:rgba(248,250,252,var(--panel-alpha));
    --surface-1-rgb:248,250,252;
    --surface-2:rgba(255,255,255,var(--panel-alpha));
    --surface-2-rgb:255,255,255;
    --surface-3:rgba(226,232,240,var(--panel-alpha));
    --surface-3-rgb:226,232,240;
    --surface-4:rgba(203,213,225,var(--panel-alpha));
    --surface-4-rgb:203,213,225;

    --border-strong:#cbd5e1;
    --border-mid:#cbd5e1;
    --text-strong:#0f172a;
    --text-primary:#1e293b;
    --text-secondary:#334155;
    --text-muted:#64748b;
    --text-subtle:#94a3b8;
    --accent-text:#1e293b;
    --background-mask-rgb:248,250,252;
}

.appearance-background-layer,
.appearance-mask-layer {
    position:fixed;
    pointer-events:none;
    opacity:0;
    transition:opacity .18s ease, filter .18s ease;
}

.appearance-background-layer {
    z-index:0;
    inset:-18px;
    background-position:center;
    background-repeat:no-repeat;
    background-size:var(--background-size);
    filter:blur(var(--background-blur));
    transform:scale(1.035);
}

.appearance-mask-layer {
    z-index:0;
    inset:0;
    background:rgba(var(--background-mask-rgb),var(--background-mask-alpha));
}

body.has-custom-background .appearance-background-layer,
body.has-custom-background .appearance-mask-layer {
    opacity:1;
}

/*
 * 自定义背景采用“VS Code 壁纸”式结构：
 * 同一张固定壁纸铺在整个窗口最底层，左栏 / 中栏 / 右栏只是覆盖在
 * 壁纸上的半透明工作区，而不是把壁纸限制在聊天区域。
 * 这里不再额外给侧栏做 backdrop blur，避免人物/图案到了两侧就糊掉；
 * 需要模糊时统一使用外观面板里的“背景模糊”。
 */
body.has-custom-background .layout {
    background:rgba(var(--surface-0-rgb),var(--workspace-alpha));
}

body.has-custom-background .left,
body.has-custom-background .right {
    background:rgba(var(--surface-1-rgb),var(--shell-alpha));
    backdrop-filter:none;
    -webkit-backdrop-filter:none;
}

body.has-custom-background .center {
    background:transparent;
}

body.has-custom-background .input {
    background:rgba(var(--surface-1-rgb),var(--composer-alpha));
    backdrop-filter:none;
    -webkit-backdrop-filter:none;
}

.layout {
    position:relative;
    z-index:1;
}

/* 大弹窗保持较高不透明度，避免背景图干扰长文本和知识图谱。 */
.modal-card {
    background:rgba(var(--surface-2-rgb),.96);
    color:var(--text-primary);
}

/* 气泡透明度与其它面板分开控制，文字/公式本身不透明。 */
.user {
    background:rgba(var(--accent-rgb),var(--bubble-alpha));
    color:#fff;
}

.ai {
    background:rgba(var(--surface-3-rgb),var(--bubble-alpha));
    color:var(--text-primary);
}

.input button,
.wrong-actions button:not(.secondary):not(.danger),
.wrong-edit-actions button:not(.secondary),
.wrong-safe-actions button:not(.secondary),
.wrong-picker-actions button:not(.secondary),
.learning-review-actions button,
.graph-status-pill.focus {
    color:#fff;
}

body[data-appearance-theme="light"] .msg-actions button {
    background:rgba(255,255,255,.58);
    color:var(--text-muted);
}

/* 黄色状态始终使用深色文字，不随明暗模式变化。 */
.graph-status-pill.learning {
    color:#111827;
}

.appearance-entry {
    margin-top:10px;
    margin-bottom:0;
    flex:0 0 auto;
}

/* 外观按钮与底部主输入控件使用同一高度，保持一套控件节奏。 */
.appearance-entry,
.input input,
.input button {
    height:46px;
    min-height:46px;
}

.appearance-entry {
    padding:0 10px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.input {
    align-items:center;
}

.input input {
    padding:0 14px;
}

.input button {
    padding:0 20px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
}

.appearance-card {
    width:min(560px, 94vw);
    max-height:88vh;
}

.appearance-body {
    padding:4px 18px 16px;
    overflow-y:auto;
}

.appearance-section {
    padding:15px 0;
    border-bottom:1px solid var(--surface-3);
}

.appearance-section:last-child {
    border-bottom:none;
}

.appearance-section-title {
    margin-bottom:10px;
    font-size:var(--font-small);
    color:var(--text-muted);
}

.appearance-segmented {
    display:grid;
    grid-template-columns:repeat(3, minmax(0, 1fr));
    gap:7px;
}

.appearance-segmented.two {
    grid-template-columns:repeat(2, minmax(0, 1fr));
}

.appearance-segmented button {
    padding:9px 8px;
    border:1px solid var(--border-strong);
    border-radius:8px;
    background:var(--surface-3);
    color:var(--text-secondary);
    cursor:pointer;
    font-size:var(--font-small);
}

.appearance-segmented button:hover {
    border-color:var(--accent-soft);
}

.appearance-segmented button.active {
    border-color:var(--accent);
    background:var(--accent-bg);
    color:var(--accent-text);
    box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb),.24);
}

.appearance-swatches {
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
}

.appearance-swatch {
    width:30px;
    height:30px;
    border-radius:50%;
    border:2px solid transparent;
    padding:0;
    cursor:pointer;
    box-shadow:0 0 0 1px var(--border-strong);
}

.appearance-swatch:hover {
    transform:scale(1.05);
}

.appearance-swatch.active {
    box-shadow:
        0 0 0 2px var(--surface-2),
        0 0 0 4px var(--accent);
}

.appearance-background-row {
    display:flex;
    align-items:center;
    gap:12px;
}

.appearance-background-preview {
    width:104px;
    height:66px;
    flex:0 0 auto;
    border-radius:9px;
    border:1px solid var(--border-strong);
    background:var(--surface-0);
    background-position:center;
    background-size:cover;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text-subtle);
    font-size:var(--font-xs);
    overflow:hidden;
}

.appearance-background-actions {
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.appearance-background-actions button,
.appearance-footer button {
    padding:8px 12px;
    border:1px solid var(--border-strong);
    border-radius:8px;
    background:var(--surface-3);
    color:var(--text-secondary);
    cursor:pointer;
}

.appearance-background-actions button.primary,
.appearance-footer button.primary {
    border-color:var(--accent-deep);
    background:var(--accent-deep);
    color:#fff;
}

.appearance-background-actions button:disabled {
    opacity:.42;
    cursor:not-allowed;
}

.appearance-slider-list {
    display:flex;
    flex-direction:column;
    gap:13px;
}

.appearance-slider-row {
    display:grid;
    grid-template-columns:126px minmax(0, 1fr) 50px;
    gap:10px;
    align-items:center;
    font-size:var(--font-small);
    color:var(--text-secondary);
}

.appearance-slider-row input[type="range"] {
    width:100%;
    accent-color:var(--accent);
}

.appearance-slider-value {
    text-align:right;
    color:var(--text-muted);
    font-variant-numeric:tabular-nums;
}

.appearance-footer {
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:14px 16px;
    border-top:1px solid var(--surface-3);
}

@media (max-width: 720px) {
    .appearance-slider-row {
        grid-template-columns:1fr 54px;
    }

    .appearance-slider-row > span:first-child {
        grid-column:1 / -1;
    }
}


/* 第三阶段：富文本复制。只增强复制层，不改变 Markdown / MathJax 渲染。 */
.panel-heading-row {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:8px;
}

.panel-heading-row.learning-title {
    margin-bottom:8px;
}

.copy-compact,
.rich-copy-button,
.graph-side-copy {
    border:1px solid rgba(148,163,184,.24);
    border-radius:7px;
    background:rgba(15,23,42,.28);
    color:var(--text-secondary);
    cursor:pointer;
    font:inherit;
    line-height:1.35;
}

.copy-compact {
    padding:3px 7px;
    font-size:var(--font-xxs);
}

.rich-copy-button {
    padding:3px 8px;
}

.copy-compact:hover,
.rich-copy-button:hover,
.graph-side-copy:hover {
    background:rgba(15,23,42,.5);
    color:var(--text-primary);
}

.rich-copy-surface,
.msg-content,
.wrong-card,
.learning-review-body,
.graph-summary,
.graph-detail-body,
.kg-history-item,
.kg-history-preview,
#learningSummary,
#info {
    -webkit-user-select:text;
    user-select:text;
}


.copy-toast {
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%);
    z-index:99999;
    padding:8px 12px;
    border:1px solid rgba(148,163,184,.28);
    border-radius:9px;
    background:rgba(15,23,42,.94);
    color:#f8fafc;
    box-shadow:0 10px 30px rgba(0,0,0,.24);
    font-size:13px;
    pointer-events:none;
}


/* 用户明确要求：这些位置不提供复制按钮。即使旧 DOM 残留也强制隐藏。 */
#infoCopyBtn,
#learningSummaryCopyBtn,
#learningReviewCopy,
#knowledgeGraphSideCopyBtn,
#wrongCopyBtn {
    display:none !important;
}

/* 节点详情 / 题目历史必须始终同一行。 */
.graph-side-tabs {
    display:flex !important;
    flex-wrap:nowrap !important;
    gap:8px;
}
.graph-side-tab {
    flex:1 1 0 !important;
    min-width:0 !important;
    white-space:nowrap !important;
    word-break:keep-all !important;
    line-height:1.2 !important;
    font-size:15px !important;
    padding:10px 6px !important;
}

/* AI 思考/回答时，让输入区本身也有明确状态，不只靠一行小字。 */
.input-wrap.ai-input-busy .input {
    box-shadow:inset 0 0 0 1px var(--accent);
    background:color-mix(in srgb, var(--surface-1) 92%, var(--accent) 8%);
}
.input-wrap.ai-input-busy #text::placeholder {
    color:var(--accent-pale);
    opacity:1;
    font-weight:600;
}


/* =========================================================
   移动端主布局
   手机端不再把整张桌面界面缩小，而是按纵向空间重新分配。
   桌面布局不受影响。
   ========================================================= */
@media (max-width: 760px) {
    html,
    body {
        width:100%;
        min-width:0;
        height:100%;
        overflow:hidden;
    }

    body {
        min-height:100dvh;
        -webkit-text-size-adjust:100%;
        text-size-adjust:100%;
    }

    .layout {
        width:100%;
        height:100dvh;
        min-height:100vh;
        display:flex;
        flex-direction:column;
        overflow:hidden;
    }

    /* 顶部会话栏：保持所有原功能，但不再占据整列宽度。 */
    .left {
        order:1;
        width:100%;
        height:auto;
        flex:0 0 auto;
        display:flex;
        flex-direction:row;
        align-items:stretch;
        gap:6px;
        padding:6px max(6px, env(safe-area-inset-right)) 6px max(6px, env(safe-area-inset-left));
        border-bottom:1px solid var(--surface-3);
        overflow:hidden;
    }

    .left > .btn {
        width:auto;
        flex:0 0 auto;
        margin:0;
        padding:8px 10px;
        min-height:38px;
        white-space:nowrap;
        font-size:14px;
    }

    #sessions {
        flex:1 1 auto;
        min-width:0;
        display:flex;
        align-items:stretch;
        gap:6px;
        overflow-x:auto;
        overflow-y:hidden;
        padding:0;
        scrollbar-width:none;
    }

    #sessions::-webkit-scrollbar {
        display:none;
    }

    .session {
        flex:0 0 auto;
        width:auto;
        min-width:108px;
        max-width:158px;
        min-height:38px;
        margin:0;
        padding:7px 8px;
        gap:5px;
    }

    .session span {
        max-width:112px;
    }

    .session .del {
        width:18px;
        height:18px;
        margin-left:2px;
    }

    #appearanceBtn {
        padding-left:9px;
        padding-right:9px;
    }

    /* 会话信息 / 学习记录放在聊天区上方，限制高度，可独立滚动。 */
    .right {
        order:2;
        width:100%;
        flex:0 0 auto;
        max-height:min(24dvh, 190px);
        overflow-y:auto;
        padding:8px 10px;
        border-bottom:1px solid var(--surface-3);
    }

    .right .panel-heading-row {
        margin-bottom:4px;
    }

    .right .small,
    .right .learning-summary {
        font-size:12px;
        line-height:1.45;
    }

    .learning-panel {
        margin-top:9px;
        padding-top:8px;
    }

    .learning-title {
        margin-bottom:4px !important;
    }

    .learning-actions {
        margin-top:6px;
        gap:6px;
    }

    .learning-actions button {
        min-height:34px;
        padding:6px 7px;
        font-size:12px;
    }

    .learning-note {
        margin-top:5px;
        font-size:11px;
    }

    /* 聊天成为手机端主要区域，输入框始终跟着聊天区落在底部。 */
    .center {
        order:3;
        width:100%;
        min-width:0;
        min-height:0;
        flex:1 1 auto;
        display:flex;
        flex-direction:column;
    }

    .chat {
        min-height:0;
        flex:1 1 auto;
        padding:10px 10px 6px;
    }

    .msg {
        max-width:92%;
        padding:10px 12px 8px;
        margin:7px 0;
        border-radius:10px;
        line-height:1.55;
    }

    .input-wrap {
        flex:0 0 auto;
        padding-bottom:env(safe-area-inset-bottom);
        background:var(--surface-1);
    }

    .input {
        gap:6px;
        padding:8px;
    }

    .input input {
        min-width:0;
        padding:9px 10px;
        font-size:16px;
    }

    .input button {
        flex:0 0 auto;
        padding:9px 11px;
        min-height:38px;
        white-space:nowrap;
        font-size:14px;
    }

    #ocrCancelBtn {
        width:30px;
        height:30px;
        min-height:30px;
        align-self:center;
    }

    .input-lock-hint {
        min-height:0;
        padding:0 10px 7px;
        font-size:12px;
    }

    .empty-tip {
        margin-top:28px;
    }

    /* 移动端弹窗只缩放尺寸，不改变功能。 */
    .modal {
        padding:10px;
    }

    .modal-card,
    .graph-modal-card,
    .appearance-card,
    .learning-review-card {
        max-width:100%;
        max-height:calc(100dvh - 20px);
    }
}

@media (max-width: 420px) {
    .left > .btn {
        padding-left:8px;
        padding-right:8px;
        font-size:13px;
    }

    .session {
        min-width:96px;
        max-width:138px;
    }

    .session span {
        max-width:94px;
    }

    .right {
        max-height:min(22dvh, 168px);
    }

    .msg {
        max-width:95%;
    }

    .input button {
        padding-left:9px;
        padding-right:9px;
        font-size:13px;
    }
}



/* =========================================================
   完整响应式补强：手机 / 平板 / 横屏手机
   只调整布局与尺寸，不改变任何业务功能。
   ========================================================= */

/* 平板与横屏手机：顶部会话栏 + 聊天主体 + 右侧学习信息。 */
@media (min-width: 761px) and (max-width: 1100px) {
    html,
    body {
        width:100%;
        min-width:0;
        height:100%;
        overflow:hidden;
    }

    body {
        min-height:100dvh;
        -webkit-text-size-adjust:100%;
        text-size-adjust:100%;
    }

    .layout {
        width:100%;
        height:100dvh;
        min-height:100vh;
        display:grid;
        grid-template-columns:minmax(0, 1fr) minmax(250px, 32vw);
        grid-template-rows:auto minmax(0, 1fr);
        grid-template-areas:
            "sessionbar sessionbar"
            "chatpanel infopanel";
        overflow:hidden;
    }

    .left {
        grid-area:sessionbar;
        width:auto;
        height:auto;
        min-width:0;
        display:flex;
        flex-direction:row;
        align-items:stretch;
        gap:7px;
        padding:7px max(8px, env(safe-area-inset-right)) 7px max(8px, env(safe-area-inset-left));
        border-bottom:1px solid var(--surface-3);
        overflow:hidden;
    }

    .left > .btn {
        width:auto;
        flex:0 0 auto;
        min-height:40px;
        margin:0;
        padding:8px 12px;
        white-space:nowrap;
        font-size:14px;
    }

    #sessions {
        flex:1 1 auto;
        min-width:0;
        display:flex;
        align-items:stretch;
        gap:7px;
        overflow-x:auto;
        overflow-y:hidden;
        scrollbar-width:none;
    }

    #sessions::-webkit-scrollbar { display:none; }

    .session {
        flex:0 0 auto;
        width:auto;
        min-width:124px;
        max-width:190px;
        min-height:40px;
        margin:0;
        padding:8px 9px;
    }

    .session span { max-width:142px; }

    .center {
        grid-area:chatpanel;
        min-width:0;
        min-height:0;
        width:auto;
    }

    .chat {
        padding:14px 14px 8px;
    }

    .msg { max-width:88%; }

    .right {
        grid-area:infopanel;
        width:auto;
        min-width:0;
        min-height:0;
        overflow-y:auto;
        padding:12px;
        border-left:1px solid var(--surface-3);
    }

    .input-wrap { min-width:0; }

    .modal {
        padding:16px;
    }

    .modal-card,
    .appearance-card,
    .learning-review-card,
    .wrong-picker-card,
    .wrong-safe-card,
    .wrong-edit-card {
        width:min(820px, calc(100vw - 32px));
        max-width:calc(100vw - 32px);
        max-height:calc(100dvh - 32px);
    }

    .graph-modal-card {
        width:calc(100vw - 32px);
        max-width:calc(100vw - 32px);
        height:calc(100dvh - 32px);
        max-height:calc(100dvh - 32px);
    }

    .ocr-review-dialog {
        width:calc(100vw - 32px);
        max-width:calc(100vw - 32px);
        max-height:calc(100dvh - 32px);
    }

    .wrong-tools {
        grid-template-columns:minmax(220px, 1fr) repeat(3, auto);
    }

    .knowledge-graph-layout {
        grid-template-columns:minmax(0, 1fr) minmax(240px, 31%);
    }
}

/* 手机：所有大弹窗直接使用手机全屏工作区。 */
@media (max-width: 760px) {
    .modal {
        padding:0;
        align-items:stretch;
        justify-content:stretch;
    }

    .modal-card,
    .appearance-card,
    .learning-review-card,
    .wrong-picker-card,
    .wrong-safe-card,
    .wrong-edit-card,
    .graph-modal-card {
        width:100%;
        max-width:100%;
        height:100dvh;
        max-height:100dvh;
        min-height:0;
        border:none;
        border-radius:0;
        box-shadow:none;
    }

    .modal-head {
        flex:0 0 auto;
        min-height:50px;
        padding:11px 12px;
        padding-top:max(11px, env(safe-area-inset-top));
    }

    .modal-head .modal-close-dot {
        width:22px;
        height:22px;
    }

    /* 错题本 */
    #wrongBookModal .modal-card {
        display:flex;
        flex-direction:column;
        overflow:hidden;
    }

    .wrong-toolbar {
        flex:0 0 auto;
        align-items:stretch;
        flex-direction:column;
        gap:8px;
        padding:8px 10px;
    }

    .wrong-stats {
        font-size:12px;
        line-height:1.5;
    }

    .wrong-filter-group {
        width:100%;
        align-items:stretch;
        flex-direction:column;
        gap:6px;
    }

    .wrong-filters {
        width:100%;
        display:flex;
        gap:6px;
        overflow-x:auto;
        overflow-y:hidden;
        padding-bottom:1px;
        scrollbar-width:none;
    }

    .wrong-filters::-webkit-scrollbar { display:none; }

    .wrong-filters button {
        flex:0 0 auto;
        min-height:36px;
        padding:7px 10px;
    }

    .wrong-tools {
        flex:0 0 auto;
        grid-template-columns:minmax(0, 1fr) minmax(0, 1fr);
        gap:7px;
        padding:8px 10px;
    }

    .wrong-search-wrap {
        grid-column:1 / -1;
    }

    .wrong-tools input,
    .wrong-tools select,
    .wrong-tools button {
        min-width:0;
        min-height:40px;
        font-size:14px;
    }

    #wrongBookList {
        flex:1 1 auto;
        min-height:0;
        overflow-y:auto;
        padding:10px;
        padding-bottom:max(10px, env(safe-area-inset-bottom));
    }

    .wrong-card {
        padding:11px;
        margin-bottom:10px;
    }

    .wrong-card-top {
        gap:7px;
        flex-wrap:wrap;
    }

    .wrong-meta-row {
        grid-template-columns:minmax(72px, auto) minmax(0, 1fr);
    }

    .wrong-actions {
        gap:6px;
    }

    .wrong-actions button {
        min-height:36px;
    }

    /* 选题、确认、编辑错题 */
    .wrong-picker-list,
    .wrong-safe-body,
    .wrong-edit-body,
    .learning-review-body,
    .appearance-body {
        flex:1 1 auto;
        min-height:0;
        overflow-y:auto;
    }

    .wrong-picker-intro {
        flex:0 0 auto;
        padding:10px 12px;
    }

    .wrong-picker-list {
        max-height:none;
        padding:10px 12px;
    }

    .wrong-picker-actions,
    .wrong-safe-actions,
    .wrong-edit-actions,
    .learning-review-actions,
    .appearance-footer {
        flex:0 0 auto;
        padding:10px 12px max(10px, env(safe-area-inset-bottom));
        gap:8px;
        flex-wrap:wrap;
    }

    .wrong-picker-actions button,
    .wrong-safe-actions button,
    .wrong-edit-actions button,
    .learning-review-actions button,
    .appearance-footer button {
        min-height:42px;
        flex:1 1 120px;
    }

    .wrong-safe-body textarea {
        min-height:180px;
    }

    .wrong-edit-body textarea {
        min-height:100px;
    }

    /* 学习回顾 */
    .learning-review-section {
        padding:11px 12px;
    }

    /* 外观 */
    .appearance-body {
        padding:4px 12px 12px;
    }

    .appearance-background-row {
        align-items:stretch;
        flex-direction:column;
    }

    .appearance-background-preview {
        width:100%;
        height:120px;
    }

    .appearance-background-actions {
        width:100%;
    }

    .appearance-background-actions button {
        flex:1 1 120px;
        min-height:40px;
    }

    .appearance-segmented button {
        min-height:40px;
    }

    /* OCR 核对：手机上全屏，图片与编辑区纵向排列。 */
    .ocr-review-dialog {
        position:fixed;
        inset:0;
        width:100vw;
        max-width:100vw;
        height:100dvh;
        max-height:100dvh;
        margin:0;
        padding:12px;
        padding-top:max(12px, env(safe-area-inset-top));
        padding-bottom:max(12px, env(safe-area-inset-bottom));
        border:none;
        border-radius:0;
        overflow-y:auto;
    }

    .ocr-review-body {
        grid-template-columns:minmax(0, 1fr);
        gap:12px;
    }

    .ocr-review-preview {
        max-height:30dvh;
    }

    .ocr-review-fields textarea {
        min-height:96px;
        margin-bottom:12px;
    }

    .ocr-review-actions {
        position:sticky;
        bottom:0;
        z-index:2;
        padding-top:10px;
        padding-bottom:max(2px, env(safe-area-inset-bottom));
        background:var(--surface-2);
        flex-wrap:wrap;
    }

    .ocr-review-actions button {
        flex:1 1 120px;
        min-height:42px;
    }

    /* 知识图谱：全屏，上图谱、下详情；两个标签仍保持同一行。 */
    .graph-modal-card {
        display:flex;
        flex-direction:column;
        overflow:hidden;
    }

    .graph-toolbar {
        flex:0 0 auto;
        padding:8px 10px;
        align-items:stretch;
        flex-direction:column;
        gap:7px;
    }

    .graph-toolbar-left {
        width:100%;
        display:grid;
        grid-template-columns:auto minmax(0, 1fr);
        gap:7px;
    }

    .graph-toolbar-left label {
        align-self:center;
    }

    .graph-toolbar-left select {
        min-width:0;
        width:100%;
    }

    .graph-toolbar-left button {
        min-height:38px;
    }

    .graph-toolbar-left button:nth-of-type(1),
    .graph-toolbar-left button:nth-of-type(2),
    .graph-toolbar-left button:nth-of-type(3) {
        grid-column:span 1;
    }

    .graph-legend {
        min-width:0;
        justify-content:flex-start;
    }

    .knowledge-graph-layout {
        flex:1 1 auto;
        min-height:0;
        display:flex;
        flex-direction:column;
        overflow-y:auto;
    }

    .knowledge-graph-main {
        flex:1 0 auto;
        min-height:300px;
        border-right:none;
        border-bottom:1px solid var(--surface-3);
    }

    .graph-summary {
        flex:0 0 auto;
        align-items:flex-start;
        flex-direction:column;
        padding:8px 10px;
    }

    .graph-summary-item {
        max-width:100%;
    }

    .graph-summary-value {
        max-width:min(72vw, 320px);
    }

    .knowledge-graph-canvas {
        min-height:240px;
        padding:8px;
    }

    .kg-section {
        min-width:max-content;
        padding:8px;
    }

    .kg-svg {
        width:auto;
        min-width:100%;
        max-width:none;
    }

    .knowledge-graph-side {
        flex:0 0 auto;
        min-height:210px;
        max-height:38dvh;
        border-bottom:none;
    }

    .graph-side-tabs {
        flex:0 0 auto;
        display:flex !important;
        flex-wrap:nowrap !important;
        gap:7px;
        padding:8px;
    }

    .graph-side-tab {
        flex:1 1 0 !important;
        white-space:nowrap !important;
        font-size:14px !important;
        min-height:40px;
    }

    .graph-side-page {
        min-height:0;
    }

    .graph-detail-body,
    .graph-history-list {
        min-height:0;
        overflow-y:auto;
    }
}

/* 极窄手机（例如 320~360 CSS px）再压一档，避免按钮互相挤压。 */
@media (max-width: 360px) {
    .left {
        gap:4px;
        padding-left:4px;
        padding-right:4px;
    }

    .left > .btn {
        padding-left:7px;
        padding-right:7px;
        font-size:12px;
    }

    .session {
        min-width:90px;
        max-width:124px;
    }

    .session span { max-width:80px; }

    .right {
        max-height:min(21dvh, 150px);
        padding:7px 8px;
    }

    .input {
        gap:4px;
        padding:6px;
    }

    .input button {
        padding-left:7px;
        padding-right:7px;
        font-size:12px;
    }

    .wrong-tools {
        grid-template-columns:1fr;
    }

    .wrong-search-wrap {
        grid-column:1;
    }

    .graph-toolbar-left {
        grid-template-columns:1fr;
    }

    .graph-toolbar-left label,
    .graph-toolbar-left select,
    .graph-toolbar-left button {
        grid-column:1 !important;
        width:100%;
    }
}

/* 横屏手机：采用平板式主布局，避免纵向堆叠吃掉聊天高度。 */
@media (min-width: 761px) and (max-width: 950px) and (max-height: 520px) {
    .right {
        font-size:12px;
    }

    .chat {
        padding-top:8px;
    }

    .modal {
        padding:6px;
    }

    .modal-card,
    .graph-modal-card,
    .appearance-card,
    .learning-review-card,
    .wrong-picker-card,
    .wrong-safe-card,
    .wrong-edit-card {
        max-height:calc(100dvh - 12px);
    }
}

</style>

<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)'], ['$','$']],
    displayMath: [['\\[', '\\]'], ['$$','$$']]
  },
  svg: {
    // 导出 PDF 时 html2canvas 对 <use> 字形缓存容易出现公式重影。
    // 直接输出独立路径，显示效果不变，但截图/导出更稳定。
    fontCache: 'none'
  }
};
</script>

<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/lib/marked.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>

</head>

<body>

<div id="appearanceBackgroundLayer" class="appearance-background-layer" aria-hidden="true"></div>
<div class="appearance-mask-layer" aria-hidden="true"></div>

<div class="layout">

<div class="left">
    <button class="btn" onclick="newChat()">＋ 新对话</button>
    <div id="sessions"></div>
    <button id="appearanceBtn" class="btn appearance-entry" type="button">◐ 外观</button>
</div>

<div class="center">
    <div id="chat" class="chat"></div>

    <div class="input-wrap">
        <div class="input">
            <input id="text" type="text" placeholder="" autocomplete="off">
            <input id="imageInput" type="file" accept="image/*" hidden>
            <button id="imageBtn" type="button">图片识题</button>
            <button id="ocrCancelBtn" type="button" hidden aria-label="撤销图片识别" title="撤销图片识别"></button>
            <button id="sendBtn" type="button" onclick="send()">发送</button>
        </div>
        <div id="inputLockHint" class="input-lock-hint hidden" aria-live="polite"></div>
    </div>
</div>

<div class="right">
    <div class="panel-heading-row">
        <div>会话信息</div>
    </div>
    <div id="info" class="small rich-copy-surface"></div>

    <div class="learning-panel">
        <div class="panel-heading-row learning-title">
            <div>学习记录</div>
        </div>
        <div id="learningSummary" class="learning-summary"></div>

        <div class="learning-actions">
            <button id="markWrongBtn" type="button">记为错题</button>
            <button id="wrongBookBtn" type="button">查看错题本 (0)</button>
        </div>

        <div class="learning-actions learning-actions-single">
            <button id="knowledgeGraphBtn" type="button">可视化知识图谱</button>
        </div>

        <div class="learning-actions learning-actions-single">
            <button id="learningReviewBtn" type="button">生成学习回顾</button>
        </div>

    </div>
</div>

</div>



<dialog id="ocrReviewDialog" class="ocr-review-dialog" aria-labelledby="ocrReviewTitle" aria-describedby="ocrReviewHelp">
    <h2 id="ocrReviewTitle">核对图片里的题目</h2>
    <div class="ocr-review-body">
        <div>
            <label class="ocr-review-zoom" for="ocrReviewZoom">放大原图<input id="ocrReviewZoom" type="range" min="100" max="300" step="25" value="100"></label>
            <div class="ocr-review-preview"><img id="ocrReviewImage" alt="本次上传的题目原图"></div>
        </div>
        <div class="ocr-review-fields">
            <label for="ocrReviewQuestion">题目文字</label>
            <textarea id="ocrReviewQuestion" rows="8" spellcheck="false"></textarea>
            <label for="ocrReviewGraph">图形信息</label>
            <textarea id="ocrReviewGraph" rows="4" spellcheck="false"></textarea>
            <label for="ocrReviewRequest">本次要求（可选）</label>
            <textarea id="ocrReviewRequest" rows="3" spellcheck="false"></textarea>
        </div>
    </div>
    <p id="ocrReviewError" role="alert"></p>
    <div class="ocr-review-actions">
        <button id="ocrReviewCancel" type="button">取消</button>
        <button id="ocrReviewConfirm" class="primary" type="button">确认题目，开始讲解</button>
    </div>
</dialog>

<div id="appearanceModal" class="modal hidden">
    <div class="modal-card appearance-card">
        <div class="modal-head">
            <div>外观</div>
            <button id="appearanceClose" class="modal-close-dot" type="button" aria-label="关闭" title="关闭"></button>
        </div>

        <div class="appearance-body">
            <div class="appearance-section">
                <div class="appearance-section-title">显示模式</div>
                <div class="appearance-segmented">
                    <button type="button" data-appearance-mode="system">跟随系统</button>
                    <button type="button" data-appearance-mode="light">浅色</button>
                    <button type="button" data-appearance-mode="dark">深色</button>
                </div>
            </div>

            <div class="appearance-section">
                <div class="appearance-section-title">主题色</div>
                <div class="appearance-swatches" aria-label="主题色">
                    <button class="appearance-swatch" type="button" data-appearance-accent="blue" aria-label="蓝色" style="background:#3b82f6"></button>
                    <button class="appearance-swatch" type="button" data-appearance-accent="purple" aria-label="紫色" style="background:#8b5cf6"></button>
                    <button class="appearance-swatch" type="button" data-appearance-accent="teal" aria-label="青绿色" style="background:#14b8a6"></button>
                </div>
            </div>

            <div class="appearance-section">
                <div class="appearance-section-title">文字大小</div>
                <div class="appearance-segmented">
                    <button type="button" data-appearance-font="small">小</button>
                    <button type="button" data-appearance-font="standard">标准</button>
                    <button type="button" data-appearance-font="large">大</button>
                </div>
            </div>

            <div class="appearance-section">
                <div class="appearance-section-title">全局背景</div>
                <div class="appearance-background-row">
                    <div id="appearanceBackgroundPreview" class="appearance-background-preview">无背景</div>
                    <div>
                        <div class="appearance-background-actions">
                            <button id="appearanceBackgroundUpload" type="button" class="primary">选择图片</button>
                            <button id="appearanceBackgroundRemove" type="button">移除背景</button>
                        </div>
                        <input id="appearanceBackgroundInput" type="file" accept="image/jpeg,image/png,image/webp" hidden>
                    </div>
                </div>

                <div class="appearance-section-title" style="margin-top:14px;">背景显示</div>
                <div class="appearance-segmented two">
                    <button type="button" data-appearance-fit="cover">填充</button>
                    <button type="button" data-appearance-fit="contain">适应</button>
                </div>
            </div>

            <div class="appearance-section">
                <div class="appearance-slider-list">
                    <label class="appearance-slider-row">
                        <span>背景遮罩</span>
                        <input id="appearanceMaskRange" type="range" min="0" max="70" step="1">
                        <span id="appearanceMaskValue" class="appearance-slider-value"></span>
                    </label>

                    <label class="appearance-slider-row">
                        <span>背景模糊</span>
                        <input id="appearanceBlurRange" type="range" min="0" max="12" step="1">
                        <span id="appearanceBlurValue" class="appearance-slider-value"></span>
                    </label>

                    <label class="appearance-slider-row">
                        <span>界面面板透明度</span>
                        <input id="appearancePanelRange" type="range" min="75" max="100" step="1">
                        <span id="appearancePanelValue" class="appearance-slider-value"></span>
                    </label>

                    <label class="appearance-slider-row">
                        <span>聊天气泡透明度</span>
                        <input id="appearanceBubbleRange" type="range" min="60" max="100" step="1">
                        <span id="appearanceBubbleValue" class="appearance-slider-value"></span>
                    </label>
                </div>
            </div>
        </div>

        <div class="appearance-footer">
            <button id="appearanceReset" type="button">恢复默认</button>
            <button id="appearanceDone" type="button" class="primary">完成</button>
        </div>
    </div>
</div>

<div id="learningReviewModal" class="modal hidden">
    <div class="modal-card learning-review-card">
        <div class="modal-head">
            <div>学习回顾</div>
            <button id="learningReviewClose" class="modal-close-dot" type="button" aria-label="关闭" title="关闭"></button>
        </div>

        <div id="learningReviewBody" class="learning-review-body"></div>

        <div class="learning-review-actions">
            
            <button id="learningReviewDone" type="button">关闭</button>
        </div>
    </div>
</div>

<div id="wrongBookModal" class="modal hidden">
    <div class="modal-card">
        <div class="modal-head">
            <div>错题本</div>
            <button id="wrongBookClose" class="modal-close-dot" type="button" aria-label="关闭" title="关闭"></button>
        </div>
        <div class="wrong-toolbar">
            <div id="wrongBookStats" class="wrong-stats"></div>
            <div class="wrong-filter-group">
                <span class="wrong-filter-label">状态筛选：</span>
                <div class="wrong-filters">
                    <button type="button" data-wrong-filter="pending">待处理</button>
                    <button type="button" data-wrong-filter="corrected">已订正</button>
                    <button type="button" data-wrong-filter="passed">已通过复测</button>
                </div>
            </div>
        </div>

        <div class="wrong-tools">
            <div class="wrong-search-wrap">
                <input id="wrongBookSearch" type="search" placeholder="搜索题目、知识点、难点或笔记" autocomplete="off">
                <button id="wrongBookSearchClear" class="wrong-search-clear hidden" type="button" aria-label="清空搜索" title="清空搜索"></button>
            </div>
            <select id="wrongBookSort" aria-label="错题排序">
                <option value="recent">最近更新</option>
                <option value="mistakes">错误次数最多</option>
                <option value="oldest">最早更新</option>
            </select>
            <button id="wrongPdfBtn" type="button" title="导出当前筛选结果为 PDF">导出 PDF</button>
            <button id="wrongClearCompletedBtn" type="button" class="danger-tool">清理已完成</button>
        </div>

        <div id="wrongBookList"></div>
    </div>
</div>

<div id="wrongQuestionPickerModal" class="modal hidden">
    <div class="modal-card wrong-picker-card">
        <div class="modal-head">
            <div>选择要加入错题本的题目</div>
            <button id="wrongQuestionPickerClose" class="modal-close-dot" type="button" aria-label="关闭" title="关闭"></button>
        </div>

        <div class="wrong-picker-intro">
            检测到这一段里包含多道独立题目。请选择真正需要记录的题，不会再把整份题库一起塞进错题本。
        </div>

        <div id="wrongQuestionPickerList" class="wrong-picker-list"></div>

        <div class="wrong-picker-actions">
            <button id="wrongQuestionPickerCancel" type="button" class="secondary">取消</button>
            <button id="wrongQuestionPickerConfirm" type="button">加入所选题目</button>
        </div>
    </div>
</div>

<div id="wrongSafeModal" class="modal hidden">
    <div class="modal-card wrong-safe-card">
        <div class="modal-head">
            <div>确认加入错题本</div>
            <button id="wrongSafeClose" class="modal-close-dot" type="button" aria-label="关闭" title="关闭"></button>
        </div>

        <div class="wrong-safe-body">
            <div id="wrongSafeProgress" class="wrong-safe-progress">
                请确认下面就是要保存的题目
            </div>
            <div id="wrongSafeSource" class="wrong-safe-source"></div>

            <label for="wrongSafeQuestion">
                题目预览（可以直接修改）
            </label>
            <textarea id="wrongSafeQuestion" rows="12"></textarea>

            <div class="wrong-safe-note">
                错题本只会保存这个编辑框里的内容。提示、解析、聊天开场白如果仍有残留，可以在这里直接删掉。
            </div>
        </div>

        <div class="wrong-safe-actions">
            <button id="wrongSafeCancel" type="button" class="secondary">取消</button>
            <button id="wrongSafeConfirm" type="button">确认加入错题本</button>
        </div>
    </div>
</div>

<div id="wrongEditModal" class="modal hidden">
    <div class="modal-card wrong-edit-card">
        <div class="modal-head">
            <div>编辑错题 / 学习笔记</div>
            <button id="wrongEditClose" class="modal-close-dot" type="button" aria-label="关闭" title="关闭"></button>
        </div>

        <div class="wrong-edit-body">
            <label for="wrongEditQuestion">题目内容</label>
            <textarea id="wrongEditQuestion" rows="8"></textarea>

            <label for="wrongEditFocus">本题难点</label>
            <input id="wrongEditFocus" type="text">

            <label for="wrongEditNote">我的笔记</label>
            <textarea id="wrongEditNote" rows="5" placeholder=""></textarea>
        </div>

        <div class="wrong-edit-actions">
            <button id="wrongEditCancel" type="button" class="secondary">取消</button>
            <button id="wrongEditSave" type="button">保存</button>
        </div>
    </div>
</div>


<div id="knowledgeGraphModal" class="modal hidden">
    <div class="modal-card graph-modal-card">
        <div class="modal-head">
            <div>可视化知识图谱</div>
            <button id="knowledgeGraphClose" class="modal-close-dot" type="button" aria-label="关闭" title="关闭"></button>
        </div>

        <div class="graph-toolbar">
            <div class="graph-toolbar-left">
                <label for="knowledgeGraphCategory">模块</label>
                <select id="knowledgeGraphCategory" aria-label="知识图谱分类"></select>
                <button id="knowledgeGraphScopeBtn" type="button">查看本对话题目</button>
                <button id="knowledgeGraphFocusBtn" type="button">查看完整模块</button>
                <button id="knowledgeGraphCopyBtn" type="button" title="复制当前图谱；支持时优先写入高清图片">复制图谱</button>
            </div>

            <div class="graph-legend">
                <span id="knowledgeGraphLegendRelated" class="legend-item current">本题相关</span>
                            </div>
        </div>

        <div class="knowledge-graph-layout">
            <div class="knowledge-graph-main">
                <div id="knowledgeGraphSummary" class="graph-summary"></div>
                <div id="knowledgeGraphCanvas" class="knowledge-graph-canvas">
                    <div class="wrong-empty">知识图谱加载中…</div>
                </div>
            </div>

            <div class="knowledge-graph-side">
                <div class="graph-side-tabs">
                    <button id="knowledgeGraphDetailTab" type="button" class="graph-side-tab active">
                        节点详情
                    </button>
                    <button id="knowledgeGraphHistoryTab" type="button" class="graph-side-tab">
                        题目历史
                    </button>
                    
                </div>

                <div id="knowledgeGraphDetailWrap" class="graph-side-page">
                    <div id="knowledgeGraphDetailTitle" class="graph-detail-title">节点详情</div>
                    <div id="knowledgeGraphDetail" class="graph-detail-body">
                        点击左侧知识点查看它与其它知识点的直接关系。
                    </div>
                </div>

                <div id="knowledgeGraphHistoryWrap" class="graph-side-page hidden">
                    <div id="knowledgeGraphHistory" class="graph-history-list"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script id="knowledgeGraphData" type="application/json">{{ knowledge_graph_data | tojson }}</script>
<script src="/static/script.js?v=phase3-final-20261002-2056b"></script>

</body>
</html>
