name: Test offline workspace

on:
  push:
    paths:
      - 'app.py'
      - 'math_diagram.py'
      - 'templates/index.html'
      - 'static/**'
      - 'scripts/sync_offline_styles.py'
      - 'scripts/sync_offline_shell.py'
      - 'scripts/test_favicon_consistency.py'
      - 'scripts/test_offline_workspace_browser.cjs'
      - 'scripts/test_offline_appearance_browser.cjs'
      - 'scripts/test_offline_data_migration_browser.cjs'
      - 'scripts/test_mobile_drawers_browser.cjs'
      - 'scripts/test_service_worker_cache_browser.cjs'
      - 'scripts/test_drawing_panels_browser.cjs'
      - 'scripts/test_math_diagram_browser.cjs'
      - '.github/workflows/test-offline-workspace.yml'
  pull_request:
    paths:
      - 'app.py'
      - 'math_diagram.py'
      - 'templates/index.html'
      - 'static/**'
      - 'scripts/sync_offline_styles.py'
      - 'scripts/sync_offline_shell.py'
      - 'scripts/test_favicon_consistency.py'
      - 'scripts/test_offline_workspace_browser.cjs'
      - 'scripts/test_offline_appearance_browser.cjs'
      - 'scripts/test_offline_data_migration_browser.cjs'
      - 'scripts/test_mobile_drawers_browser.cjs'
      - 'scripts/test_service_worker_cache_browser.cjs'
      - 'scripts/test_drawing_panels_browser.cjs'
      - 'scripts/test_math_diagram_browser.cjs'
      - '.github/workflows/test-offline-workspace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-agents.txt
      - name: Validate Python syntax
        run: python -m py_compile app.py
      - name: Validate offline JavaScript syntax
        run: |
          node --check static/offline.js
          node --check static/offline-entry.js
          node --check static/offline-service-worker.js
          node --check static/offline-shell.js
          node --check static/offline-appearance.js
          node --check static/offline-knowledge-graph.js
          node --check static/script.js
          node --check scripts/test_offline_workspace_browser.cjs
          node --check scripts/test_offline_appearance_browser.cjs
          node --check scripts/test_offline_data_migration_browser.cjs
          node --check scripts/test_mobile_drawers_browser.cjs
          node --check scripts/test_service_worker_cache_browser.cjs
          node --check scripts/test_drawing_panels_browser.cjs
          node --check scripts/test_math_diagram_browser.cjs
      - name: Verify offline styles match the online workspace
        run: |
          python scripts/sync_offline_styles.py --check
          python scripts/sync_offline_shell.py --check
      - name: Validate JSON content packs
        run: |
          python -m json.tool static/offline-content/concepts.zh-CN.json > /dev/null
          python -m json.tool static/offline-content/questions.zh-CN.json > /dev/null
          python -m json.tool static/offline-content/knowledge_graph.json > /dev/null
      - name: Validate content references
        run: |
          python - <<'PY'
          import json
          concepts = json.load(open("static/offline-content/concepts.zh-CN.json", encoding="utf-8"))
          questions = json.load(open("static/offline-content/questions.zh-CN.json", encoding="utf-8"))
          graph = json.load(open("static/offline-content/knowledge_graph.json", encoding="utf-8"))
          graph_ids = {node["id"] for node in graph["nodes"]}
          concept_ids = {item["id"] for item in concepts["concepts"]}
          assert len(concept_ids) == len(concepts["concepts"])
          assert all(item["id"] in graph_ids for item in concepts["concepts"])
          assert all(ref in concept_ids for question in questions["questions"] for ref in question["knowledge_points"])
          assert all(len(item["title"]) and len(item["definition"]) for item in concepts["concepts"])
          assert all(len(item["statement"]) and len(item.get("explanation", "")) for item in questions["questions"])
          print(f'{len(concepts["concepts"])} concepts; {len(questions["questions"])} questions; references valid')
          PY
      - name: Verify service worker precache files exist
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          worker = Path("static/offline-service-worker.js").read_text(encoding="utf-8")
          paths = re.findall(r'"(/(?:offline|static/[^"]+))"', worker)
          missing = [p for p in paths if p != "/offline" and not Path(p.split("?", 1)[0].lstrip("/")).exists()]
          assert not missing, f"Missing precache assets: {missing}"
          print(f"{len(paths)} precache entries checked")
          PY
      - name: Install application and browser dependencies
        run: |
          python -m pip install -r requirements.txt
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify the original favicon variants on each platform
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python scripts/test_favicon_consistency.py
      - name: Start the application
        env:
          PORT: '5000'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          python app.py > /tmp/dmate-offline-browser-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5000/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dmate-offline-browser-server.log
          exit 1
      - name: Exercise the full workspace without networking
        env:
          DMATE_TEST_BASE_URL: http://127.0.0.1:5000
          OFFLINE_SCREENSHOT_DIR: artifacts/offline-workspace
        run: |
          mkdir -p artifacts/offline-workspace
          node scripts/test_offline_workspace_browser.cjs
          node scripts/test_offline_appearance_browser.cjs
          node scripts/test_offline_data_migration_browser.cjs
          node scripts/test_service_worker_cache_browser.cjs
          node scripts/test_mobile_drawers_browser.cjs
          node scripts/test_drawing_panels_browser.cjs
          node scripts/test_math_diagram_browser.cjs
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-workspace-screenshots
          path: artifacts/offline-workspace
          if-no-files-found: ignore
      - name: Print server failures
        if: failure()
        run: cat /tmp/dmate-offline-browser-server.log || true
