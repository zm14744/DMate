name: Sync DMate Icon Assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_icons.py"
      - "scripts/check_icon_assets.py"
      - "templates/index.html"
      - "app.py"
      - "static/script.js"
      - "scripts/test_install_dialog.cjs"
      - ".github/workflows/sync-icon-assets.yml"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Generate icons
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python scripts/generate_icons.py
          python scripts/check_icon_assets.py
      - name: Check front-end script and graph review rendering
        run: |
          node --check static/script.js
          node tests/graph_display_regression.js
      - name: Commit canonical binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f -- static/icons desktop/src-tauri/icons
          if git diff --cached --quiet; then
            echo "Canonical icons unchanged"
          else
            git commit -m "Sync generated DMate icons"
            git push origin HEAD:main
          fi
