name: Graph Editor Focused Browser UI

on:
  push:
    branches: [main]
    paths:
      - 'static/graph-editor.js'
      - 'static/graph-editor-model.js'
      - 'static/graph-editor-format.js'
      - 'static/graph-editor-overlay.js'
      - 'static/graph-scan-workspace.js'
      - 'static/graph-editor.css'
      - 'tests/test_visual_graph_editor.py'
      - 'tests/test_graph_overlay.py'
      - 'tests/test_graph_canvas_workspace.py'
      - 'tests/test_graph_text_workspace.py'
      - 'tests/test_graph_frame_gestures.py'
      - 'tests/test_scan_drawing_separation.py'
      - 'tests/test_graph_appearance_ui.py'
      - 'static/voice-input.js'
      - 'static/voice-input.css'
      - 'tests/test_voice_input_ui.py'
      - 'tests/test_voice_no_result_ui.py'
      - 'tests/test_ocr_batch_frontend.py'
      - 'tests/test_scan_selection_save.py'
      - 'tests/test_scan_information_sources.py'
      - 'static/chat-composer.js'
      - 'static/chat-composer.css'
      - 'static/ai-answer-renderer.js'
      - 'static/ai-answer-renderer.css'
      - 'tests/test_ai_answer_rendering.py'
      - 'tests/test_interaction_surfaces.py'
      - 'tests/test_graph_outline_smoothness.py'
      - 'static/drawing-workspace.js'
      - 'static/drawing-workspace.css'
      - 'static/drawing-export.js'
      - 'tests/test_drawing_workspace.py'
      - 'tests/test_drawing_editor_controls.py'
      - 'tests/test_drawing_app_integration.py'
      - 'tests/test_conversation_delete_navigation.py'
      - 'tests/test_chat_composer.py'
      - 'static/concept-notebook.js'
      - 'static/concept-notebook.css'
      - 'tests/test_concept_notebook_ui.py'
      - 'tests/test_learning_tool_entries.py'
      - 'tests/test_graph_elastic_regions.py'
      - 'static/script.js'
      - 'templates/index.html'
      - 'tests/test_ocr_upload_layout.py'
      - '.github/workflows/graph-editor-ui-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dmate-editor-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only graph-editor browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest==8.4.2 playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Test actual graph-editor controls without AI or backend requests
        shell: bash
        run: |
          set -euo pipefail
          export DMATE_BROWSER_EXECUTABLE="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as browser_api:
              print(browser_api.chromium.executable_path)
          PY
          )"
          test -x "$DMATE_BROWSER_EXECUTABLE"
          python -m pytest -q \
            tests/test_ai_answer_rendering.py \
            tests/test_interaction_surfaces.py \
            tests/test_graph_outline_smoothness.py \
            tests/test_drawing_workspace.py \
            tests/test_drawing_editor_controls.py \
            tests/test_drawing_app_integration.py \
            tests/test_conversation_delete_navigation.py \
            tests/test_chat_composer.py \
            tests/test_scan_information_sources.py \
            tests/test_concept_notebook_ui.py \
            tests/test_learning_tool_entries.py \
            tests/test_graph_elastic_regions.py \
            tests/test_voice_input_ui.py \
            tests/test_voice_no_result_ui.py \
            tests/test_ocr_batch_frontend.py \
            tests/test_scan_selection_save.py \
            tests/test_graph_appearance_ui.py \
            tests/test_scan_drawing_separation.py \
            tests/test_visual_graph_editor.py::test_real_browser_edits_and_confirms_the_same_user_visible_document \
            tests/test_visual_graph_editor.py::test_question_type_survives_graph_edit_and_reaches_save \
            tests/test_visual_graph_editor.py::test_real_browser_mobile_layout_and_one_click_delete \
            tests/test_graph_overlay.py::test_overlay_zoom_out_and_fit_below_100_percent \
            tests/test_graph_overlay.py::test_overlay_keeps_image_and_zoom_when_selecting_or_renaming \
            tests/test_graph_overlay.py::test_repeated_vertex_placement_does_not_jump_back_to_top \
            tests/test_graph_overlay.py::test_original_can_be_hidden_for_drawing_only_and_opacity_is_adjustable \
            tests/test_graph_overlay.py::test_points_and_edges_choose_high_contrast_ink_from_local_pixels \
            tests/test_graph_overlay.py::test_empty_auto_detected_panel_has_no_predrawn_strokes \
            tests/test_graph_overlay.py::test_pure_text_ocr_does_not_create_a_dummy_graph_canvas \
            tests/test_graph_canvas_workspace.py \
            tests/test_graph_text_workspace.py \
            tests/test_graph_frame_gestures.py \
            tests/test_ocr_upload_layout.py
