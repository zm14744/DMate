name: Retest Original Graph Diagrams - Split and Edges
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retest-original-graph-topology.yml"
      - "tests/retest_graph_diagram_topology.py"
concurrency:
  group: dmate-original-graph-topology-full
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  original-graph-crops:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch: [global, curated, extra]
    env:
      PYTHONPATH: .:tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install independent original image tools
        run: python -m pip install "requests>=2.31,<3" "Pillow>=10,<12" "PyMuPDF>=1.24,<2"
      - name: Compile topology benchmark
        run: python -m py_compile tests/retest_graph_diagram_topology.py
      - name: Check if latest topological pixel fix is deployed
        run: |
          python - <<'PY'
          import requests, time
          target="2026-10-21-hough-blue-outline-cv-v3"
          for attempt in range(16):
              try:
                  data=requests.get("https://dmate.zeabur.app/health",timeout=15).json()
                  found=data.get("graph_topology_revision")
                  print("DEPLOYMENT_CHECK",attempt+1,found,flush=True)
                  if found==target:
                      print("DEPLOYMENT_CURRENT",flush=True)
                      break
              except Exception as exc:
                  print("DEPLOYMENT_ERROR",type(exc).__name__,flush=True)
              if attempt < 15: time.sleep(20)
          else:
              raise SystemExit("DEPLOYMENT_NOT_VERIFIED: refuse to grade old graph version")
          PY
      - name: Submit every original image for graph split and edge OCR
        run: |
          python tests/retest_graph_diagram_topology.py \
            --batch "${{ matrix.batch }}" \
            --delay 8 --timeout 115 \
            --output "graph_topology_${{ matrix.batch }}.json"
      - name: Count actual graph-recognition verdicts, not answer status
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, sys
          for f in sorted(pathlib.Path(".").glob("graph_topology_*.json")):
              data=json.loads(f.read_text())
              rows=data.get("cases",[])
              print("REPORT",f.name,"CASES",len(rows),"REVISION_VERIFIED",
                    data.get("deployed_revision_verified"),flush=True)
              failures=[]
              for row in rows:
                  status=row.get("status")
                  print("ORIGINAL",row.get("id"),"SPLIT_EXPECTED",row.get("expected_graph_count"),
                        "SPLIT_CV",row.get("cv_evidence",{}).get("count"),
                        "EDGE",row.get("edge_gold_verdict"),"RESULT",status,flush=True)
                  if status in {"SOURCE_FAILED","OCR_REQUEST_FAILED","OCR_HTTP_FAILED",
                                "NO_GRAPH_TRANSCRIPTION","CV_PANEL_COUNT_MISMATCH",
                                "EDGE_LIST_MISMATCH"}:
                      failures.append(row.get("id"))
              print("FAILED_OR_UNVERIFIED_RAW_IMAGES",failures,flush=True)
              # Do not return green for a batch with confirmed source,
              # image, panel or exact-edge mismatch failures.
              if failures:
                  sys.exit(1)
          PY
      - name: Upload original image crops plus complete raw OCR output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph-topology-${{ matrix.batch }}-originals-and-ocr
          path: |
            graph_topology_${{ matrix.batch }}.json
            graph_topology_originals/${{ matrix.batch }}/*.png
          retention-days: 30
          if-no-files-found: warn
