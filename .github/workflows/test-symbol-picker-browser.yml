name: Verify DMate Symbol Picker Across Mac and iPad

on:
  push:
    branches: [main]
    paths:
      - 'static/chat-composer.css'
      - 'static/chat-composer.js'
      - 'static/language-catalog.js'
      - 'static/language-knowledge.js'
      - 'static/language.js'
      - 'static/ui-tooltip.js'
      - 'scripts/test_symbol_picker_browser.cjs'
      - '.github/workflows/test-symbol-picker-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test engines
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Exercise Mac Safari and iPad click/layout paths
        run: node scripts/test_symbol_picker_browser.cjs
