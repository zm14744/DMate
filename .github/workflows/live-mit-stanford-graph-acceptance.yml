name: Live MIT and Stanford Graph Repair Acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-mit-stanford-graph-acceptance.yml"
permissions:
  contents: read
concurrency:
  group: single-mit-stanford-graph-acceptance
  cancel-in-progress: false
jobs:
  original-exam-retest:
    runs-on: ubuntu-22.04
    timeout-minutes: 19
    env:
      PYTHONPATH: .
      DMATE_BENCH_URL: https://dmate.zeabur.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install university original-diagram tools
        run: python -m pip install "requests>=2.31,<3" "Pillow>=10,<12" "PyMuPDF>=1.24,<2"
      - name: Wait for exact MIT and Stanford graph safety code on Zeabur
        run: |
          python - <<'PY'
          import requests,sys,time,json
          expected="2026-10-20-v1-standalone-edge-compare-and-quiz-boundary"
          for i in range(13):
              try:
                  data=requests.get("https://dmate.zeabur.app/health",timeout=16).json()
                  print("DEPLOY_CHECK",i+1,json.dumps(data,ensure_ascii=False),flush=True)
                  if data.get("single_graph_dual_edge_audit_version")==expected:
                      print("LATEST_GRAPH_FIX_DEPLOYED",flush=True)
                      sys.exit(0)
              except Exception as e:
                  print("HEALTH_RETRY",type(e).__name__,flush=True)
              if i<12:time.sleep(18)
          print("NOT_DEPLOYED: cannot validate graph fixes against older code",flush=True)
          sys.exit(2)
          PY
      - name: Retest MIT original crossed lines and Stanford six trees and NJU arrows
        continue-on-error: true
        run: |
          python tests/curated_university_graph_images.py \
            --only MIT05_P3 --only STANFORD_TREE6 --only NJU_DIRECTED \
            --delay 13 --timeout 110 \
            --output live_mit_stanford_nju_v5.json
      - name: Validate the actual graph topology, reply and uncertainty outcomes
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib,sys,re
          file=pathlib.Path("live_mit_stanford_nju_v5.json")
          if not file.exists():
              print("MISSING_RETEST_ARTIFACT",flush=True)
              sys.exit(1)
          data=json.loads(file.read_text(encoding="utf-8"))
          if not data.get("deployment_verified"):
              print("STALE_DEPLOYMENT_ON_RETEST",flush=True)
              sys.exit(2)
          cases={x["id"]:x for x in data["cases"]}
          required={"MIT05_P3","STANFORD_TREE6","NJU_DIRECTED"}
          if set(cases)!=required:
              print("NOT_ALL_ORIGINALS_TESTED",list(cases),flush=True)
              sys.exit(1)
          issues=[]
          for id,item in cases.items():
              status=item.get("verdict")
              reply=item.get("answer","")
              visual=item.get("visual_text","")
              print("RETEST",id,status,"OCR",item.get("ocr_http"),
                    "CHAT",item.get("answer_http"),flush=True)
              if item.get("ocr_http")!=200 or item.get("answer_http")!=200:
                  issues.append((id,"request failed"))
                  continue
              if status not in ("SAFE_UNCERTAIN_REVIEW","GOLD_TOKENS_PRESENT_NEEDS_EDGE_REVIEW"):
                  issues.append((id,status))
              if "【图形结构待核对】" in visual:
                  if not re.search(r"核对|无法确定|尚未",reply):
                      issues.append((id,"uncertain image with confident answer"))
                  if "【题目】" in reply and "【答案】" in reply:
                      issues.append((id,"invented new question"))
              if id=="MIT05_P3" and "【图形结构待核对】" not in visual:
                  from graph_answer_integrity import single_undirected_named_edges
                  result=single_undirected_named_edges(visual)
                  expected={"AB","BC","BH","CD","CE","DE","EF","EH","FG"}
                  if result is None or {"".join(x) for x in result["edges"]}!=expected:
                      issues.append((id,"unverified/wrong MIT topology"))
              if id=="STANFORD_TREE6" and "【题目】" in reply and "【答案】" in reply:
                  issues.append((id,"wrongly generated a quiz"))
          if issues:
              print("ACCEPTANCE_FAILURE",issues,flush=True)
              sys.exit(1)
          print("ACCEPTANCE_SAFETY_PASS: count correct answers separately from flagged uncertainty",flush=True)
          PY
      - name: Archive raw originals and full response transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-mit-stanford-nju-image-acceptance-evidence
          path: |
            live_mit_stanford_nju_v5.json
            curated_university_graph_samples/*.png
          retention-days: 30
          if-no-files-found: warn
