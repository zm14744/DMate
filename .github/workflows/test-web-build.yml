name: Test web image inputs

on:
  push:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'scripts/generate_icons.py'
      - 'scripts/test_generate_web_icons.py'
      - 'scripts/test_docker_context.py'
      - '.github/workflows/test-web-build.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'scripts/generate_icons.py'
      - 'scripts/test_generate_web_icons.py'
      - 'scripts/test_docker_context.py'
      - '.github/workflows/test-web-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install the pinned icon renderer
        run: python -m pip install Pillow==11.3.0
      - name: Verify cached web icons preserve the published artwork
        run: python scripts/test_generate_web_icons.py -v
      - name: Inspect actual Docker build context and required runtime files
        run: python scripts/test_docker_context.py -v
