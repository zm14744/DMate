<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>DMate</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #0d0d0d;
      color: #f5f5f5;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-width: 280px; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0d0d0d;
    }
    main { width: 100%; max-width: 320px; text-align: center; }
    .mark {
      width: 48px; height: 48px; margin: 0 auto 16px;
      display: grid; place-items: center;
      border-radius: 14px; background: #000;
    }
    .mark svg { width: 31px; height: 31px; }
    h1 { margin: 0 0 9px; font-size: 19px; font-weight: 650; }
    p { margin: 0; color: #999; font-size: 13px; line-height: 1.65; }
    a {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 42px; margin-top: 22px; padding: 0 18px;
      border-radius: 999px; background: #3478f6; color: white;
      font-size: 14px; font-weight: 600; text-decoration: none;
    }
    a:hover { background: #2869df; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 3.8 31.8 10.2 34.5 23.1 25.2 34.2 12.1 32.5 4.5 21.8 8.1 9.2Z" stroke="#E8E8E8" stroke-width="1.2"/>
        <path d="m20 3.8-2.2 12.1 13.9-5.7M17.8 15.9l-5.7 16.6m5.7-16.6 16.7 7.2M17.8 15.9 8.1 9.2m9.7 6.7 7.4 18.3" stroke="#BDBDBD" stroke-width="1"/>
      </svg>
    </div>
    <h1>正在打开 DMate</h1>
    <p>正在加载 DMate 侧边栏。如果页面没有自动打开，可以手动继续。</p>
    <a id="openDmate" href="https://dmate.zeabur.app/">打开 DMate</a>
  </main>
  <script src="sidebar.js"></script>
</body>
</html>
