name: Live Graph Panel Fix - Targeted Originals
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-graph-panel-fix.yml"
permissions:
  contents: read
jobs:
  graph-image-acceptance:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .:tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original-PDF rendering dependencies
        run: python -m pip install "requests>=2.31,<3" "Pillow>=10,<12" "PyMuPDF>=1.24,<2"
      - name: Wait for the graph panel image crop revision
        run: |
          python - <<'PY'
          import time,requests,sys
          expected="2026-10-21-hough-blue-outline-cv-v3"
          for i in range(20):
              try:
                  r=requests.get("https://dmate.zeabur.app/health",timeout=10).json()
                  got=r.get("graph_topology_revision")
                  print("LIVE_GRAPH_REVISION",i+1,got,flush=True)
                  if got == expected: sys.exit(0)
              except Exception as e:
                  print(type(e).__name__,flush=True)
              time.sleep(12)
          raise SystemExit("CURRENT_CODE_NOT_DEPLOYED")
          PY
      - name: Retest original Stanford six trees, MIT four diagrams, MIT crossings and NJU arrows
        run: |
          python tests/retest_graph_diagram_topology.py \
            --batch curated --delay 9 --timeout 110 \
            --only STANFORD_TREE6 --only MIT05_FOUR \
            --only MIT05_P3 --only NJU_DIRECTED \
            --output targeted_graph_topology.json
      - name: Print image split plus actual edge validity, never falsely green
        if: always()
        run: |
          python - <<'PY'
          import pathlib,json,collections
          p=pathlib.Path("targeted_graph_topology.json")
          if not p.exists(): raise SystemExit("NO_RESULT_FILE")
          data=json.loads(p.read_text())
          for row in data["cases"]:
              print("REAL_IMAGE",row["id"],row["status"],
                    "VISION_CAPTIONS",row.get("caption_numbers"),
                    "CV_COUNT",row.get("cv_evidence",{}).get("count"),
                    "EDGE_GOLD",row.get("edge_gold_verdict"),
                    "TEXT",str(row.get("ocr",{}).get("visual_text",""))[:450],flush=True)
          print("FINAL_STATES",dict(collections.Counter(
              row["status"] for row in data["cases"])),flush=True)
          PY
      - name: Save all unchanged original figures and full OCR results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph-panel-v2-original-figures-and-results
          path: |
            targeted_graph_topology.json
            graph_topology_originals/curated/*.png
          retention-days: 30
          if-no-files-found: warn
