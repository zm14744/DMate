name: Package DMate Firefox Add-on

on:
  push:
    branches: [main]
    paths:
      - 'browser-extension/firefox/**'
      - '.github/workflows/package-firefox-addon.yml'
      - 'templates/index.html'
      - 'static/**'
      - 'docs/SECURITY_PRIVACY.md'
      - 'THIRD_PARTY_LICENSES.md'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate Firefox Manifest V3 package
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re

          root = pathlib.Path("browser-extension/firefox")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["manifest_version"] == 3
          assert manifest["version"] == "1.0.4"
          assert manifest["sidebar_action"]["default_panel"] == "sidebar.html"
          assert manifest["browser_specific_settings"]["gecko"]["id"]
          assert manifest["browser_specific_settings"]["gecko"]["strict_min_version"] == "140.0"
          assert set(manifest["browser_specific_settings"]["gecko"]["data_collection_permissions"]["required"]) == {
              "authenticationInfo", "personalCommunications", "personallyIdentifyingInfo"
          }
          assert manifest["background"]["scripts"] == ["background.js"]
          assert "service_worker" not in manifest["background"]
          assert "sidePanel" not in manifest.get("permissions", [])
          assert "side_panel" not in manifest
          manifests = sorted(p.relative_to(root).as_posix() for p in root.rglob("manifest.json"))
          assert manifests == ["manifest.json"], f"Unexpected nested manifest files: {manifests}"
          assert (root / "static/vendor/vendor-packages.json").is_file()

          html = (root / "sidebar.html").read_text(encoding="utf-8")
          assert "<iframe" not in html.lower()
          assert "{{" not in html and "{%" not in html
          assert not re.search(r'\son[a-z]+\s*=', html, re.I)
          for attrs, body in re.findall(r'<script\b([^>]*)>([\s\S]*?)</script\s*>', html, re.I):
              if "src=" not in attrs.lower() and 'application/json' not in attrs.lower():
                  assert not body.strip()
          for value in re.findall(r'''(?:src|href)=["'](/static/[^"']+)["']''', html, re.I):
              relative = value.split("?", 1)[0].lstrip("/")
              assert (root / relative).is_file(), f"Missing local asset: {relative}"
          assert (root / "extension/api-bridge.js").is_file()
          assert "credentials: 'include'" in (root / "extension/api-bridge.js").read_text(encoding="utf-8")

          background = (root / "background.js").read_text(encoding="utf-8")
          assert "browser.action.onClicked" in background
          assert "browser.sidebarAction.toggle()" in background
          print(f"Validated {manifest['name']} Firefox {manifest['version']}")
          PY

      - name: Build Firefox Add-on ZIP
        run: |
          rm -f browser-extension/DMate_Firefox_Addon.zip
          (cd browser-extension/firefox && zip -X -qr ../DMate_Firefox_Addon.zip .)
          python - <<'PY'
          import pathlib
          import zipfile
          package = pathlib.Path("browser-extension/DMate_Firefox_Addon.zip")
          with zipfile.ZipFile(package) as archive:
              names = archive.namelist()
              manifests = sorted(name for name in names if pathlib.PurePosixPath(name).name.lower() == "manifest.json")
              assert manifests == ["manifest.json"], f"Expected one root manifest.json: {manifests}"
              assert "sidebar.html" in names
              assert "background.js" in names
              assert "icons/icon128.png" in names
              assert "static/vendor/vendor-packages.json" in names
          print(f"Firefox ZIP validated: {package.stat().st_size} bytes.")
          PY

      - name: Assemble AMO source-code submission package
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/dmate-firefox-source"
          mkdir -p "$SRC/extension" "$SRC/original-frontend/static" "$SRC/vendor-source"
          cp -a browser-extension/firefox/. "$SRC/extension/"
          cp templates/index.html "$SRC/original-frontend/templates-index.html"
          cp -a static/. "$SRC/original-frontend/static/"
          cp docs/SECURITY_PRIVACY.md "$SRC/SECURITY_PRIVACY.md"
          cp THIRD_PARTY_LICENSES.md "$SRC/THIRD_PARTY_LICENSES.md"
          cp browser-extension/firefox/static/vendor/vendor-packages.json "$SRC/vendor-packages.json"

          cat > "$SRC/README.md" <<'EOF'
          # DMate Firefox Add-on — Source Code Submission

          This archive accompanies the DMate Firefox Manifest V3 add-on submitted to Mozilla Add-ons (AMO).

          ## Contents

          - extension/: the exact Firefox extension source tree used to build the submitted ZIP.
          - original-frontend/templates-index.html: the original server-side HTML template.
          - original-frontend/static/: the original first-party front-end assets and vendored browser libraries.
          - vendor-packages.json: exact upstream npm package versions, registry tarball URLs, integrity values, and vendored file hashes.
          - vendor-source/: official npm package archives for the vendored third-party libraries.
          - SECURITY_PRIVACY.md: repository documentation describing data flows, local storage, server processing, and third-party services.
          - THIRD_PARTY_LICENSES.md: third-party license inventory.

          ## Reproducing the package

          1. Use Node.js with npm and Python 3.
          2. The exact upstream dependencies are recorded in vendor-packages.json:
             - mathjax 3.2.2
             - marked 15.0.12
             - dompurify 3.2.6
             - html2canvas 1.4.1
             - jspdf 2.5.2
          3. The matching official npm archives are included under vendor-source/. Their package versions and integrity values are also recorded in vendor-packages.json.
          4. The extension uses the original DMate front-end resources locally. extension/sidebar.html is the extension-ready adaptation of the original template: server-side template expressions are resolved or removed, executable inline scripts are moved to local files under extension/extension/, and the API bridge routes application API requests to the declared DMate backend host.
          5. The Firefox-specific integration is defined by extension/manifest.json and extension/background.js. It uses Firefox's native sidebar_action API; the application UI and first-party front-end assets are otherwise reused from the Edge package.
          6. To package the exact extension tree, run:
             cd extension && zip -X -qr ../DMate_Firefox_Addon.zip .

          No remote JavaScript or WebAssembly is loaded for execution. The extension's application requests go to https://dmate.zeabur.app/; the backend may forward user-submitted content to the configured AI and email providers as documented in SECURITY_PRIVACY.md.
          EOF

          for spec in mathjax@3.2.2 marked@15.0.12 dompurify@3.2.6 html2canvas@1.4.1 jspdf@2.5.2; do
            npm pack "$spec" --pack-destination "$SRC/vendor-source"
          done

          rm -f browser-extension/DMate_Firefox_Source_Code.zip
          (cd "$SRC" && zip -X -qr "$GITHUB_WORKSPACE/browser-extension/DMate_Firefox_Source_Code.zip" .)
          python - <<'PY'
          import pathlib, zipfile
          p = pathlib.Path("browser-extension/DMate_Firefox_Source_Code.zip")
          with zipfile.ZipFile(p) as z:
              names = z.namelist()
              assert "README.md" in names
              assert "extension/manifest.json" in names
              assert "original-frontend/templates-index.html" in names
              assert "vendor-packages.json" in names
              assert any(n.startswith("vendor-source/") and n.endswith(".tgz") for n in names)
          print(f"AMO source package validated: {p.stat().st_size} bytes.")
          PY

      - name: Upload Firefox submission artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DMate-Firefox-AMO-Submission-v1.0.4
          path: |
            browser-extension/DMate_Firefox_Addon.zip
            browser-extension/DMate_Firefox_Source_Code.zip
          if-no-files-found: error
          retention-days: 90

      - name: Commit generated Firefox packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser-extension/DMate_Firefox_Addon.zip browser-extension/DMate_Firefox_Source_Code.zip
          if git diff --cached --quiet; then
            echo "Firefox packages are already up to date."
            exit 0
          fi
          git commit -m "Build DMate Firefox AMO submission packages"
          git push origin HEAD:main
