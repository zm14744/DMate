name: Diagnose Live University Math and OCR Health
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-live-university-math.yml"
permissions:
  contents: read
concurrency:
  group: dmate-production-math-benchmarks
  cancel-in-progress: false
jobs:
  live-diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Diagnose deployed version and two previously failed real-university answers
        run: |
          python - <<'PY'
          import json,time,urllib.request,urllib.error,pathlib,re,sys
          base="https://dmate.zeabur.app"
          report={"health":{},"tests":[]}
          def call(path,payload=None):
              body=json.dumps(payload,ensure_ascii=False).encode() if payload is not None else None
              req=urllib.request.Request(
                  base+path,data=body,
                  headers={"Content-Type":"application/json","User-Agent":"DMate-University-Safe-Recheck"},
              )
              try:
                  with urllib.request.urlopen(req,timeout=90) as response:
                      status=response.status
                      raw=response.read().decode("utf-8","replace")
              except urllib.error.HTTPError as e:
                  status=e.code
                  raw=e.read().decode("utf-8","replace")
              try:data=json.loads(raw)
              except ValueError:data={"body":raw[:1400]}
              return status,data
          # A healthy /health endpoint once coexisted with universal
          # /chat HTTP500. Wait specifically for the corrected handler, not
          # merely for any working web process or the old graph version.
          needed="2026-10-20-current-user-initialized-for-all-chat-requests"
          for attempt in range(19):
              status,health=call("/health")
              print("DEPLOY_VERSION",attempt+1,status,
                    health.get("chat_route_fix_version"),flush=True)
              if status==200 and health.get("chat_route_fix_version")==needed:
                  break
              if attempt<18:time.sleep(20)
          report["health"]={"status":status,"data":health}
          print("REAL_LIVE_HEALTH",status,json.dumps(health,ensure_ascii=False),flush=True)
          if health.get("chat_route_fix_version")!=needed:
              print("CHAT_500_HOTFIX_NOT_DEPLOYED",flush=True)
              pathlib.Path("live_math_diagnostic.json").write_text(
                  json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
              sys.exit(2)
          cases=[
              ("MIT_X06_LOGIC",
               "请直接给出最终答案并简要解释。命题 (p→q) 与 (¬p∨q) 是否逻辑等价？"),
              ("NJU_SET_CARDINALITY",
               "请直接给出最终答案并简要解释。已知 |A|=5, |P(B)|=512, |P(A△B)|=1024，求 |A∩B|。"),
          ]
          for i,(id,q) in enumerate(cases):
              if i:time.sleep(15)
              try:
                  http,data=call("/chat",{"messages":[{"role":"user","content":q}]})
              except Exception as e:
                  http=0;data={"error":repr(e)}
              reply=str(data.get("reply",""))
              ok=(http==200 and
                  (("等价" in reply and "不逻辑等价" not in reply)
                    if id=="MIT_X06_LOGIC" else
                   (("|A∩B|=2" in reply or "|A\\cap B|=2" in reply or "交集大小为 2" in reply)
                    and "最终答案" in reply)))
              result={"id":id,"status":http,"ok":ok,"reply":reply[:8000],
                      "error":data.get("error"),"raw":data.get("body")}
              report["tests"].append(result)
              print("REAL_CHAT_TEST",id,http,"PASS" if ok else "FAIL",
                    json.dumps(data,ensure_ascii=False)[:700],flush=True)
          pathlib.Path("live_math_diagnostic.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          if status!=200 or any(not t["ok"] for t in report["tests"]):
              sys.exit(1)
          PY
      - name: Archive health and live response evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-dmate-university-math-diagnostic
          path: live_math_diagnostic.json
          retention-days: 30
          if-no-files-found: warn
