[package]
name = "dmate-desktop"
version = "1.0.2"
description = "DMate - 离散数学智能辅学系统"
authors = ["DMate"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
dmate-offline-vault = { path = "offline-vault" }
serde_json = "1"
getrandom = "0.2.16"
zeroize = "1.8"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
