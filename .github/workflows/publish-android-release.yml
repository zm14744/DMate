name: Publish Verified DMate Android Release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful main-branch Build DMate Android Release run ID
        required: true
        type: string
      expected_head_sha:
        description: Full source commit SHA of that Android build
        required: true
        type: string
      expected_apk_sha256:
        description: Independently verified SHA256 of DMate.apk (version 1.0.3 / code 4)
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: dmate-publish-android-1.0.3
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      EXPECTED_APK_SHA256: ${{ inputs.expected_apk_sha256 }}
    steps:
      - name: Check out reviewed publisher
        uses: actions/checkout@v7

      - name: Require main and verify build provenance / available credentials
        env:
          GH_TOKEN: ${{ github.token }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          python scripts/publish_android_release.py preflight \
            --build-run-id "$BUILD_RUN_ID" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --expected-apk-sha256 "$EXPECTED_APK_SHA256"

      - name: Download the verified build artifact
        uses: actions/download-artifact@v4
        with:
          name: DMate-release-apk
          path: ${{ runner.temp }}/dmate-android-publication
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android verification tools
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;36.0.0"

      - name: Verify APK and publish new immutable asset
        env:
          GH_TOKEN: ${{ github.token }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/publish_android_release.py publish \
            --build-run-id "$BUILD_RUN_ID" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --expected-apk-sha256 "$EXPECTED_APK_SHA256" \
            --apk "$RUNNER_TEMP/dmate-android-publication/DMate.apk" \
            --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            --report "$RUNNER_TEMP/android-publication.json"

      - name: Preserve verified per-source publication report
        uses: actions/upload-artifact@v4
        with:
          name: DMate-Android-1.0.3-publication-report
          path: ${{ runner.temp }}/android-publication.json
          if-no-files-found: error
          retention-days: 30
