name: Historical University Fixes Live Acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/historical-university-fixes-live.yml"
      - "app.py"
      - "graph_answer_integrity.py"
      - "tests/test_historical_university_failures.py"
concurrency:
  group: historical-university-live-repair
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  live-math-and-graph:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    env:
      PYTHONPATH: .
      DMATE_BENCH_URL: https://dmate.zeabur.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OCR benchmark dependencies
        run: python -m pip install "requests>=2.31,<3" "Pillow>=10,<12" "PyMuPDF>=1.24,<2" "Flask>=3,<4"
      - name: Verify real deployment contains both graph and chat hotfix
        run: |
          python - <<'PY'
          import requests,sys,json
          data=requests.get("https://dmate.zeabur.app/health",timeout=20).json()
          print("ACTUAL_LIVE_VERSIONS",json.dumps(data,ensure_ascii=False),flush=True)
          expected={"chat_route_fix_version":"2026-10-20-current-user-initialized-for-all-chat-requests",
                    "single_graph_dual_edge_audit_version":"2026-10-20-v1-standalone-edge-compare-and-quiz-boundary",
                    "historical_university_repairs_version":"2026-10-20-v2-generic-ocr-hold-and-multitree-topology"}
          mismatch={k:{"want":v,"got":data.get(k)} for k,v in expected.items() if data.get(k)!=v}
          if mismatch:
              print("OLD_OR_INCOMPLETE_ZEABUR_DEPLOYMENT",json.dumps(mismatch),flush=True)
              sys.exit(2)
          print("NEW_CHAT_AND_GRAPH_CODE_LIVE",flush=True)
          PY
      - name: Test actual NJU SJTU logic/relation questions with real chat
        continue-on-error: true
        run: |
          python tests/chinese_university_regression.py \
            --slice chinese --limit 8 --delay 10 --timeout 105 \
            --strict --output history_chinese_university.json
      - name: Test latest original MIT and NJU graph diagrams through OCR to AI
        continue-on-error: true
        run: |
          python tests/curated_university_graph_images.py \
            --only MIT05_P3 --only NJU_DIRECTED --only STANFORD_TREE6 \
            --delay 12 --timeout 105 --output history_graph_originals.json
      - name: Audit complete results without allowing keyword-only green
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib,sys,collections
          c=pathlib.Path("history_chinese_university.json")
          g=pathlib.Path("history_graph_originals.json")
          if not c.exists() or not g.exists():
              print("INCOMPLETE_TEST_OUTPUTS",c.exists(),g.exists(),flush=True)
              sys.exit(1)
          chinese=json.loads(c.read_text(encoding="utf-8"))
          graph=json.loads(g.read_text(encoding="utf-8"))
          text=chinese.get("text",[])
          images=graph.get("cases",[])
          print("CHINESE_CASES",[(r.get("id"),r.get("verdict")) for r in text],flush=True)
          print("GRAPH_CASES",[(r.get("id"),r.get("verdict")) for r in images],flush=True)
          if len(text)<8 or len(images)!=3:
              sys.exit(1)
          failures=[]
          for row in text:
              if row.get("verdict") not in ("TOKEN_MATCH_PROOF_REVIEW",):
                  failures.append((row.get("id"),row.get("verdict")))
          for row in images:
              if row.get("ocr_http")!=200 or row.get("answer_http")!=200:
                  failures.append((row.get("id"),"API_FAILURE"))
              if row.get("verdict") not in ("SAFE_UNCERTAIN_REVIEW","GOLD_TOKENS_PRESENT_NEEDS_EDGE_REVIEW"):
                  failures.append((row.get("id"),row.get("verdict")))
          print("FAILURES",failures,flush=True)
          if failures:
              sys.exit(1)
          print("LIVE_REGRESSION_NO_CONFIRMED_ERRORS; GRAPH_IMAGE_GOLD_STILL_REQUIRES_MANUAL_EDGES",flush=True)
          PY
      - name: Preserve raw OCR, chat, and university source image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-university-repair-live-evidence
          path: |
            history_chinese_university.json
            history_graph_originals.json
            curated_university_graph_samples/*.png
          retention-days: 30
          if-no-files-found: warn
