<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>DMate</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #0d0d0d;
      color: #ededed;
      --panel: #171717;
      --composer: #252525;
      --muted: #929292;
      --line: #303030;
      --accent: #347cf6;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; min-width: 280px; margin: 0; overflow: hidden; }
    body { display: flex; flex-direction: column; background: #0d0d0d; }
    button, textarea { font: inherit; }
    button { color: inherit; }
    .topbar {
      height: 58px; flex: 0 0 58px; display: grid;
      grid-template-columns: 42px 1fr 42px; align-items: center;
      padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--panel);
    }
    .icon-button {
      width: 36px; height: 36px; display: grid; place-items: center;
      border: 0; border-radius: 10px; background: transparent; color: #dedede; cursor: pointer;
    }
    .icon-button:hover { background: #292929; }
    .icon-button svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .brand { display: flex; justify-content: center; align-items: center; gap: 9px; font-size: 18px; font-weight: 700; }
    .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: #000; }
    .brand-mark svg { width: 26px; height: 26px; }
    .menu {
      position: absolute; z-index: 5; top: 52px; left: 10px; width: min(230px, calc(100vw - 20px));
      padding: 6px; border: 1px solid #343434; border-radius: 12px; background: #202020;
      box-shadow: 0 12px 32px #0009;
    }
    .menu[hidden] { display: none; }
    .menu button, .menu a {
      display: block; width: 100%; padding: 11px 12px; border: 0; border-radius: 8px;
      background: transparent; color: #eee; text-align: left; text-decoration: none; font-size: 13px; cursor: pointer;
    }
    .menu button:hover, .menu a:hover { background: #303030; }
    #chat {
      flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 18px 14px 24px;
      display: flex; flex-direction: column; gap: 18px; scrollbar-width: thin;
      scrollbar-color: #454545 transparent;
    }
    .message { max-width: 100%; font-size: 14px; line-height: 1.7; overflow-wrap: anywhere; }
    .message.user {
      align-self: flex-end; max-width: 88%; padding: 10px 14px;
      border-radius: 18px 18px 5px 18px; background: #292929; color: #f4f4f4;
      white-space: pre-wrap;
    }
    .message.assistant { align-self: stretch; color: #e7e7e7; padding: 0 2px; }
    .message.assistant p { margin: 0 0 11px; }
    .message.assistant p:last-child { margin-bottom: 0; }
    .message.assistant strong { font-weight: 700; color: #fff; }
    .message.assistant code { padding: 1px 4px; border-radius: 4px; background: #252525; }
    .typing { color: var(--muted); font-size: 13px; padding: 0 2px; }
    .composer-area { flex: 0 0 auto; padding: 8px 12px max(12px, env(safe-area-inset-bottom)); background: #0d0d0d; }
    .question-mode {
      display: flex; align-items: center; gap: 12px; height: 28px; padding: 0 12px 5px;
      color: #a7a7a7; font-size: 12px;
    }
    .choice { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; color: #dedede; }
    .choice input { appearance: none; width: 16px; height: 16px; margin: 0; border: 2px solid #888; border-radius: 50%; background: transparent; }
    .choice input:checked { border: 5px solid var(--accent); }
    .composer {
      display: flex; align-items: flex-end; gap: 8px; min-height: 58px; padding: 7px 8px 7px 16px;
      border: 1px solid #303030; border-radius: 32px; background: var(--composer);
    }
    #prompt {
      flex: 1 1 auto; min-width: 0; max-height: 150px; min-height: 42px; resize: none;
      padding: 10px 0 8px; border: 0; outline: 0; background: transparent; color: #f2f2f2;
      font-size: 15px; line-height: 22px;
    }
    #prompt::placeholder { color: #858585; }
    #send {
      flex: 0 0 42px; width: 42px; height: 42px; display: grid; place-items: center;
      border: 0; border-radius: 50%; background: var(--accent); color: #fff; cursor: pointer;
    }
    #send:disabled { opacity: .45; cursor: default; }
    #send svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .notice { padding: 4px 12px 0; color: #777; font-size: 10px; line-height: 1.45; text-align: center; }
    .error { color: #ff8d8d; font-size: 12px; padding: 0 2px; }
  </style>
</head>
<body>
  <header class="topbar">
    <button class="icon-button" id="menuButton" aria-label="菜单" title="菜单">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 3.8 31.8 10.2 34.5 23.1 25.2 34.2 12.1 32.5 4.5 21.8 8.1 9.2Z" stroke="#E8E8E8" stroke-width="1.2"/>
          <path d="m20 3.8-2.2 12.1 13.9-5.7M17.8 15.9l-5.7 16.6m5.7-16.6 16.7 7.2M17.8 15.9 8.1 9.2m9.7 6.7 7.4 18.3" stroke="#BDBDBD" stroke-width="1"/>
        </svg>
      </span>
      <span>DMate</span>
    </div>
    <button class="icon-button" id="settingsButton" aria-label="打开完整 DMate" title="打开完整 DMate">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="18" r="2"/></svg>
    </button>
  </header>
  <nav class="menu" id="menu" hidden>
    <button id="newChat">新建对话</button>
    <a href="https://dmate.zeabur.app/" target="_blank" rel="noopener noreferrer">打开完整 DMate 网站</a>
  </nav>
  <main id="chat" aria-live="polite"></main>
  <section class="composer-area">
    <div class="question-mode" role="group" aria-label="题目标记">
      <span>题目</span>
      <label class="choice"><input type="radio" name="questionMode" value="yes"><span>是</span></label>
      <label class="choice"><input type="radio" name="questionMode" value="no" checked><span>否</span></label>
    </div>
    <form class="composer" id="composer">
      <textarea id="prompt" rows="1" placeholder="询问 DMate" aria-label="询问 DMate"></textarea>
      <button id="send" type="submit" aria-label="发送">
        <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </form>
    <div class="notice">侧边栏聊天暂以访客模式运行；账号、图片识题和学习工具可在完整网站中使用。</div>
  </section>
  <script src="sidebar.js"></script>
</body>
</html>
