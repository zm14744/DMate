[package]
name = "dmate-desktop"
version = "1.0.2"
description = "DMate - 离散数学智能辅学系统"
authors = ["DMate"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
dmate-offline-vault = { path = "offline-vault" }
serde_json = "1"
getrandom = "0.2.16"
zeroize = "1.8"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["alloc", "NSString", "NSURL"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
