name: Publish DMate Snap to Snap Store

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Promote an existing revision or upload a genuinely new build
        type: choice
        options:
          - upload-new-build
          - promote-existing
        required: true
        default: upload-new-build
      build_run_id:
        description: Successful Build DMate Snap run ID (required for upload-new-build)
        type: string
        required: false
      revision:
        description: Existing Snap Store revision (only for promote-existing)
        type: string
        required: false
      channel:
        description: Target Snap Store channel
        type: choice
        options:
          - edge
          - beta
          - candidate
          - stable
        required: true
        default: edge

permissions:
  contents: read
  actions: read

concurrency:
  group: dmate-snap-store-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release configuration
        if: inputs.operation == 'upload-new-build'
        uses: actions/checkout@v4

      - name: Check Snap Store credentials
        shell: bash
        env:
          STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [[ -z "$STORE_CREDENTIALS" ]]; then
            echo "::error::Add SNAPCRAFT_STORE_CREDENTIALS in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install Snapcraft for existing revision
        if: inputs.operation == 'promote-existing'
        run: sudo snap install snapcraft --classic

      - name: Promote revision without re-uploading
        if: inputs.operation == 'promote-existing'
        shell: bash
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          REVISION: ${{ inputs.revision }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          if [[ ! "$REVISION" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Revision must be a positive integer."
            exit 1
          fi
          /snap/bin/snapcraft release dmate "$REVISION" "$CHANNEL"

      - name: Verify the explicitly selected Snap build
        if: inputs.operation == 'upload-new-build'
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Enter the successful Build DMate Snap run ID in build_run_id."
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}" > "$RUNNER_TEMP/snap-build-run.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .status == "completed" and .conclusion == "success" and
            .head_branch == "main" and .path == ".github/workflows/build-snap.yml" and
            .repository.full_name == $repo and .head_repository.full_name == $repo
          ' "$RUNNER_TEMP/snap-build-run.json" > /dev/null
          echo "run_id=$BUILD_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using successful Snap build run $BUILD_RUN_ID"
          jq -r '"Source commit: " + .head_sha' "$RUNNER_TEMP/snap-build-run.json"

      - name: Download existing Snap artifact
        if: inputs.operation == 'upload-new-build'
        uses: actions/download-artifact@v4
        with:
          name: DMate-linux-snap-amd64
          path: snap-package
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Locate and verify Snap package
        if: inputs.operation == 'upload-new-build'
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' snaps < <(find snap-package -type f -name '*.snap' -print0)
          if [[ ${#snaps[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one .snap in the downloaded artifact, found ${#snaps[@]}."
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools python3-yaml
          unsquashfs -cat "${snaps[0]}" meta/snap.yaml > "$RUNNER_TEMP/dmate-snap-metadata.yaml"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml

          expected = yaml.safe_load(Path("snap/snapcraft.yaml").read_text())
          actual = yaml.safe_load((Path(os.environ["RUNNER_TEMP"]) / "dmate-snap-metadata.yaml").read_text())
          for key in ("name", "version", "base", "confinement"):
              if str(actual.get(key)) != str(expected.get(key)):
                  raise SystemExit(f"Snap {key} does not match current release configuration")
          if actual.get("architectures") != ["amd64"]:
              raise SystemExit("Expected an amd64 Snap package")
          print(f"Verified {actual['name']} {actual['version']} (amd64)")
          PY
          echo "snap=${snaps[0]}" >> "$GITHUB_OUTPUT"
          ls -lh "${snaps[0]}"
          sha256sum "${snaps[0]}"

      - name: Check whether the exact Snap is already released
        if: inputs.operation == 'upload-new-build'
        id: store
        shell: bash
        env:
          SNAP_PATH: ${{ steps.pkg.outputs.snap }}
          CHANNEL: ${{ inputs.channel }}
        run: python3 scripts/check_snap_store_channel.py "$SNAP_PATH" "$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Upload and release Snap
        if: inputs.operation == 'upload-new-build' && steps.store.outputs.already_released != 'true'
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.pkg.outputs.snap }}
          release: ${{ inputs.channel }}
