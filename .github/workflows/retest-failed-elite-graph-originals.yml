name: Retest Failed Elite University Graph Originals
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retest-failed-elite-graph-originals.yml"
permissions:
  contents: read
concurrency:
  group: single-real-elite-graph-retest
  cancel-in-progress: false
jobs:
  live-dmate:
    runs-on: ubuntu-22.04
    timeout-minutes: 29
    env:
      PYTHONPATH: .
      DMATE_BENCH_URL: https://dmate.zeabur.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real image OCR test dependencies
        run: python -m pip install "requests>=2.31,<3" "Pillow>=10,<12" "PyMuPDF>=1.24,<2"
      - name: Verify deployed graph protection v4
        run: |
          python - <<'PY'
          import requests,sys,json
          data=requests.get("https://dmate.zeabur.app/health",timeout=20).json()
          print("LIVE_HEALTH",json.dumps(data,ensure_ascii=False),flush=True)
          expected="2026-10-20-v4-independent-directed-and-multigraph-vertex-audit"
          if data.get("graph_image_audit_version")!=expected:
              print("STALE_DEPLOYMENT",flush=True)
              sys.exit(2)
          PY
      - name: Retest original MIT crossing, Stanford trees, NJU arrows and India K4
        continue-on-error: true
        run: |
          python tests/curated_university_graph_images.py \
            --only MIT05_P3 --only STANFORD_TREE6 \
            --only NJU_DIRECTED --only INDIA_BITMESRA_ISO \
            --delay 15 --timeout 110 \
            --output retest_elite_curated.json
      - name: Retest original SJTU three-graph Euler question
        continue-on-error: true
        run: |
          python tests/global_graph_picture_benchmark.py \
            --start 0 --count 1 --pause 15 --timeout 110 --strict \
            --output retest_sjtu_euler.json --directory original_graph_retest_samples
      - name: Retest Aizu University original isomorphism graph
        continue-on-error: true
        run: |
          python tests/global_graph_picture_benchmark.py \
            --start 9 --count 1 --pause 15 --timeout 110 --strict \
            --output retest_aizu_isomorphism.json --directory original_graph_retest_samples
      - name: Retest original Cornell final isomorphism diagrams
        continue-on-error: true
        run: |
          python tests/global_graph_picture_benchmark.py \
            --start 13 --count 1 --pause 15 --timeout 110 --strict \
            --output retest_cornell_isomorphism.json --directory original_graph_retest_samples
      - name: Audit actual result counts and refuse false green
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib,collections,sys
          names=["retest_elite_curated.json","retest_sjtu_euler.json",
                 "retest_aizu_isomorphism.json","retest_cornell_isomorphism.json"]
          rows=[]
          missing=[]
          for name in names:
              p=pathlib.Path(name)
              if not p.exists():
                  missing.append(name)
                  continue
              data=json.loads(p.read_text(encoding="utf-8"))
              for row in data["cases"]:
                  status=row.get("verdict",row.get("status","NO_VERDICT"))
                  print("TEST_RESULT",row["id"],status,
                        "OCR_HTTP",row.get("ocr_http"),
                        "ANSWER_HTTP",row.get("answer_http",row.get("chat_http")),
                        "OCR_GOLD",row.get("recognition_verdict",""),flush=True)
                  rows.append((row["id"],status))
          print("MISSING_RESULTS",missing,flush=True)
          print("TOTAL",len(rows),"COUNTS",dict(collections.Counter(x[1] for x in rows)),flush=True)
          if missing or len(rows)<7:
              sys.exit(1)
          # Separate safe uncertainty and proof-review from genuine exact failures;
          # strict release certification requires no detected failure.
          failures=[(id,status) for id,status in rows
                    if status in ("ANSWER_WRONG","ANSWER_REQUEST_FAILED","OCR_FAILED",
                      "SOURCE_FAILED","SOURCE_OR_RUNTIME_FAILURE","OCR_HTTP_FAILURE",
                      "ANSWER_HTTP_FAILURE","CONFIRMED_WRONG_NUMERIC_CLAIM",
                      "CONFIRMED_WRONG_TREE_COUNT","CONFIRMED_WRONG_CONNECTIVITY",
                      "CONFIRMED_WRONG_GRAPH_VERTEX_COUNT","CONFIRMED_WRONG_ISOMORPHISM",
                      "OCR_WRONG_EDGE_LIST","OCR_WRONG_VERTEX_COUNT",
                      "OCR_WRONG_DIRECTED_EDGES","OCR_CONTRADICTORY_EDGE_LIST",
                      "ANSWER_SUSPECT_REVIEW")]
          if failures:
              print("CONFIRMED_OR_UNRESOLVED_FAILURES",failures,flush=True)
              sys.exit(1)
          print("NO_AUTOMATED_ANOMALIES; VISUAL GOLD STILL REQUIRES EDGE REVIEW",flush=True)
          PY
      - name: Archive complete diagrams, OCR, full chat and gold comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-live-elite-graph-retest
          path: |
            retest_elite_curated.json
            retest_sjtu_euler.json
            retest_aizu_isomorphism.json
            retest_cornell_isomorphism.json
            curated_university_graph_samples/*.png
            original_graph_retest_samples/*.png
          retention-days: 30
          if-no-files-found: warn
