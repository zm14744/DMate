name: University Verified Answer Benchmarks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  answers:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        block: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install "requests>=2.31,<3"
      - name: Check Python and independent oracles
        run: |
          python -m py_compile tests/university_answer_benchmark.py
          PYTHONPATH=. python -c 'import sys;sys.path.insert(0,"tests");from university_answer_benchmark import validate_bank;print("VERIFIED_BANK",len(validate_bank()))'
      - name: Run university questions against real deployed DMate
        env:
          DMATE_BENCH_URL: https://dmate.zeabur.app
        run: |
          python tests/university_answer_benchmark.py \
            --start $((${{ matrix.block }} * 30)) \
            --max-cases 30 --timeout 65 --delay 10 \
            --results university_answers_block_${{ matrix.block }}.json --strict
      - name: Persist every answer and oracle for human proof audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: university-answer-results-${{ matrix.block }}
          path: university_answers_block_${{ matrix.block }}.json
          if-no-files-found: warn
          retention-days: 30
