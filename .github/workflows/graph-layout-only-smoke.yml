name: Lightweight OCR Without Predrawing

on:
  push:
    branches: [main]
    paths:
      - 'graph_layout_only.py'
      - 'ocr_runtime.py'
      - 'static/script.js'
      - 'static/graph-editor.js'
      - 'app.py'
      - 'tests/test_graph_layout_only.py'
      - 'tests/manual_type_cache_contract.cjs'
      - 'static/graph-editor-overlay.js'
      - 'static/graph-editor-model.js'
      - '.github/workflows/graph-layout-only-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-predrawing:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only offline image and test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            pytest==8.4.2 Pillow==11.3.0 numpy==2.1.3 opencv-python-headless==4.11.0.86
      - name: Verify text fast-path and figure metadata-only output
        run: |
          python -m pytest -q tests/test_graph_layout_only.py
          python -m py_compile app.py graph_layout_only.py ocr_runtime.py
      - name: Verify UI JavaScript syntax
        run: |
          node --check static/script.js
          node --check static/graph-editor.js
          node --check static/graph-editor-overlay.js
          node tests/manual_type_cache_contract.cjs
