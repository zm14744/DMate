name: Graph Data Integrity Unit Checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'graph_ocr_cleanup.py'
      - 'graph_validation.py'
      - 'ai.py'
      - 'app.py'
      - 'static/script.js'
      - 'tests/test_graph_ocr_cleanup.py'
      - 'tests/test_graph_vision_routing.py'
      - 'tests/graph_display_regression.js'
      - 'ocr.py'
      - 'graph_arrow_evidence.py'
      - 'graph_line_tracer.py'
      - 'graph_recognition.py'
      - 'graph_black_disk_trace.py'
      - 'graph_sparse_panels.py'
      - 'tests/test_graph_pixel_geometry.py'
      - 'tests/test_graph_pixel_image.py'
      - '.github/workflows/graph-integrity-unit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graph-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: python -m pip install Pillow requests networkx numpy opencv-python-headless
      - name: Python syntax check
        run: python -m py_compile graph_ocr_cleanup.py graph_validation.py ai.py app.py ocr.py graph_arrow_evidence.py graph_line_tracer.py graph_recognition.py graph_black_disk_trace.py graph_sparse_panels.py
      - name: Run graph invariants and OCR routing tests (no AI calls)
        run: |
          python -m unittest discover -s tests -p 'test_graph_ocr_cleanup.py' -v
          python -m unittest discover -s tests -p 'test_graph_vision_routing.py' -v
          python -m unittest discover -s tests -p 'test_graph_pixel_geometry.py' -v
          python -m unittest discover -s tests -p 'test_graph_pixel_image.py' -v
      - name: Browser script syntax check
        run: |
          node --check static/script.js
          node tests/graph_display_regression.js
