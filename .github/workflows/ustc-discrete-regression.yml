name: USTC Discrete Logic Lecture Regression
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Chinese University Discrete Math Regression"]
    types: [completed]
permissions:
  contents: read
jobs:
  ustc:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      DMATE_BENCH_URL: https://dmate.zeabur.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "requests>=2.31,<3"
      - name: Run 7 USTC authenticated lecture examples
        run: |
          python tests/chinese_university_regression.py \
            --slice ustc --delay 9 --timeout 75 --strict \
            --output ustc_lecture_results.json
      - name: Preserve full replies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ustc-lecture-discrete-results
          path: ustc_lecture_results.json
          retention-days: 30
          if-no-files-found: warn
