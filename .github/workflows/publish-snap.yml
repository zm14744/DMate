name: Publish DMate Snap to Snap Store

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Promote an existing revision or upload a genuinely new build
        type: choice
        options:
          - promote-existing
          - upload-new-build
        required: true
        default: promote-existing
      revision:
        description: Existing Snap Store revision (the first DMate revision is 1)
        type: string
        required: true
        default: '1'
      channel:
        description: Target Snap Store channel
        type: choice
        options:
          - edge
          - beta
          - candidate
          - stable
        required: true
        default: edge

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check Snap Store credentials
        shell: bash
        env:
          STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [[ -z "$STORE_CREDENTIALS" ]]; then
            echo "::error::Add SNAPCRAFT_STORE_CREDENTIALS in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install Snapcraft for existing revision
        if: inputs.operation == 'promote-existing'
        run: sudo snap install snapcraft --classic

      - name: Promote revision without re-uploading
        if: inputs.operation == 'promote-existing'
        shell: bash
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          REVISION: ${{ inputs.revision }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          if [[ ! "$REVISION" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Revision must be a positive integer."
            exit 1
          fi
          /snap/bin/snapcraft release dmate "$REVISION" "$CHANNEL"

      - name: Locate latest successful Snap build
        if: inputs.operation == 'upload-new-build'
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/build-snap.yml/runs" \
            -f branch=main -f status=success -f per_page=1 \
            --jq '.workflow_runs[0].id // empty')"
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful Build DMate Snap (GitHub) run on main."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using Snap build run $run_id"

      - name: Download existing Snap artifact
        if: inputs.operation == 'upload-new-build'
        uses: actions/download-artifact@v4
        with:
          name: DMate-linux-snap-amd64
          path: snap-package
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Locate and verify Snap package
        if: inputs.operation == 'upload-new-build'
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' snaps < <(find snap-package -type f -name '*.snap' -print0)
          if [[ ${#snaps[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one .snap in the downloaded artifact, found ${#snaps[@]}."
            exit 1
          fi
          echo "snap=${snaps[0]}" >> "$GITHUB_OUTPUT"
          ls -lh "${snaps[0]}"
          sha256sum "${snaps[0]}"

      - name: Upload and release Snap
        if: inputs.operation == 'upload-new-build'
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.pkg.outputs.snap }}
          release: ${{ inputs.channel }}
