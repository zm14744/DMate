name: Publish Verified Desktop Release to GitHub

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: dmate-github-desktop-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'zm14744/DMate' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish verified existing builds to GitHub only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_desktop_release.py
