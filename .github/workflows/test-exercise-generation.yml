name: Verify DMate Exercise Generation

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'teaching.py'
      - 'question_knowledge_graph.py'
      - 'question_topic_structure.py'
      - 'server_i18n.py'
      - 'classification_semantic.py'
      - 'answer_catalog.py'
      - 'scripts/test_question_knowledge_graph.py'
      - 'scripts/test_catalog_semantic_classification.py'
      - 'scripts/test_answer_catalog_*.py'
      - 'scripts/test_catalog_topic_benchmark.py'
      - 'scripts/fixtures/catalog_topic_benchmark.json'
      - 'scripts/fixtures/catalog_semantic_captured_v4.json'
      - 'tutoring_intent.py'
      - 'ai.py'
      - 'concept_notebook.py'
      - 'conversation_titles.py'
      - 'proof_writing.py'
      - 'proof_writing_extended.py'
      - 'docs/PROOF_WRITING_STANDARD.md'
      - 'docs/PROOF_WRITING_STANDARD.en.md'
      - 'scripts/test_proof_writing.py'
      - 'scripts/test_tutoring_*.py'
      - 'scripts/test_startup_lightweight.py'
      - 'exercise_relation_check.py'
      - 'exercise_intent.py'
      - 'static/exercise-intent-rules.json'
      - 'scripts/test_exercise_generation_regression.py'
      - 'scripts/test_conversation_context.py'
      - 'scripts/test_conversation_titles.py'
      - 'scripts/test_concept_notebook_selection.py'
      - 'scripts/test_exercise_context.py'
      - '.github/workflows/test-exercise-generation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exercise-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile proof-writing integrations
        run: python -m py_compile app.py teaching.py question_knowledge_graph.py question_topic_structure.py classification_semantic.py answer_catalog.py server_i18n.py tutoring_intent.py ai.py concept_notebook.py conversation_titles.py proof_writing.py proof_writing_extended.py
      - name: Run offline exercise regressions
        run: python -m unittest discover -s scripts -p 'test_exercise_generation_regression.py' -v
      - name: Run proof-writing policy regressions
        run: python -m unittest discover -s scripts -p 'test_proof_writing.py' -v
      - name: Run natural-language tutoring regressions
        run: python -m unittest discover -s scripts -p 'test_tutoring_intent.py' -v
      - name: Run proof context regressions
        run: python -m unittest discover -s scripts -p 'test_tutoring_context.py' -v
      - name: Install chat route test dependencies
        run: python -m pip install Flask==3.1.2 requests==2.32.5 Pillow==11.3.0 jsonschema==4.26.0
      - name: Verify source-bound question knowledge graphs
        run: python -m unittest discover -s scripts -p 'test_question_knowledge_graph.py' -v
      - name: Verify bounded catalog classification protocol
        run: python -m unittest discover -s scripts -p 'test_catalog_semantic_classification.py' -v
      - name: Verify answer catalog metadata and private streaming suffix
        run: python -m unittest discover -s scripts -p 'test_answer_catalog_*.py' -v
      - name: Verify local fallback and independent catalog benchmark contract
        run: python scripts/test_catalog_topic_benchmark.py
      - name: Verify semantic conversation title summaries
        run: python -m unittest discover -s scripts -p 'test_conversation_titles.py' -v
      - name: Verify selected concept explanation and relationship counts
        run: python -m unittest discover -s scripts -p 'test_concept_notebook_selection.py' -v
      - name: Run chat intent regressions without external AI calls
        run: python -m unittest discover -s scripts -p 'test_tutoring_chat.py' -v
      - name: Verify lightweight web startup and lazy image readers
        run: python -m unittest discover -s scripts -p 'test_startup_lightweight.py' -v
      - name: Verify multi-turn context and task continuation
        run: |
          python -m unittest discover -s scripts -p 'test_conversation_context.py' -v
          python -m unittest discover -s scripts -p 'test_exercise_context.py' -v
