name: DMate Two Original OUC Images — Live OCR and Human Gold Check

on:
  workflow_dispatch:
  # Only fixture/proof changes trigger paid real OCR, not every code push.
  push:
    branches: [main]
    paths:
      - ".github/workflows/ouc-original-compare.yml"
      - "tests/fixtures/original_ouc_20261021/**"
      - "tests/fixtures/ouc_two_originals_gold.json"
      - "tests/ouc_original_accuracy.py"

permissions:
  contents: read

concurrency:
  group: dmate-ouc-original-live
  cancel-in-progress: false

jobs:
  compare-original-pngs:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify the exact uploaded PNG bytes (no redrawing or compression)
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          spec=json.loads(pathlib.Path('tests/fixtures/ouc_two_originals_gold.json').read_text(encoding='utf-8'))
          src=pathlib.Path('tests/fixtures/original_ouc_20261021')
          for case in spec['cases']:
              name=case['image']
              actual=hashlib.sha256((src/name).read_bytes()).hexdigest()
              assert actual==case['source_sha256'], f'Original PNG bytes changed: {name}'
              print('ORIGINAL_PNG_VERIFIED',name,'SHA256',actual,flush=True)
          PY
      - name: Install Playwright and Chromium for actual DMate image input
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Upload both original images through the real browser and capture the /ocr response and popup
        shell: bash
        run: |
          set +e
          python tests/ocr_regression.py \
            --mode live \
            --cases tests/fixtures/ouc_two_originals_gold.json \
            --image-dir tests/fixtures/original_ouc_20261021 \
            --limit 2 \
            --timeout 240 \
            --output artifacts/ouc-two-originals
          status=$?
          echo "PLAYWRIGHT_OCR_EXIT_STATUS=$status"
          exit 0
      - name: Compare with ChatGPT's independent visual reading and print the *actual* OCR and popup text
        shell: bash
        run: |
          python tests/ouc_original_accuracy.py \
            --cases tests/fixtures/ouc_two_originals_gold.json \
            --results artifacts/ouc-two-originals \
            --output artifacts/ouc-two-originals
      - name: Save original /ocr JSON, actual popup captures, Playwright traces and comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dmate-real-ouc-two-originals
          path: |
            artifacts/ouc-two-originals/
          retention-days: 7
          if-no-files-found: warn
